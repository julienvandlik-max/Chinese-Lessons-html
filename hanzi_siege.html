<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>墨战 Ink Siege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --jade:#2F6D4F; --jade-dark:#1B4633; --jade-light:#5FA57D;
    --seal:#B23A2E; --seal-dark:#7A2A21; --seal-light:#E07264;
    --ink:#17181B; --canal:#4A7A96; --gold:#D4A64B; --gold-light:#F0D9A0;
    --paper:#F1ECDD; --paper-dim:#E4DCC6; --stone:#9C8F72; --stone-dark:#6B6047;
    --good:#3E8E5C; --bad:#B23A2E; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{
    font-family:'Baloo 2','Noto Sans SC',sans-serif;
    color:var(--paper);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(47,109,79,0.35), transparent 55%),
      radial-gradient(circle at 85% 100%, rgba(178,58,46,0.25), transparent 55%),
      var(--ink);
    display:flex;
    flex-direction:column;
    padding:18px 16px 28px;
    position:relative;
    overflow-x:hidden;
  }
  .zh{font-family:'Noto Sans SC','Baloo 2',sans-serif;}
  h1,h2,h3{margin:0;font-weight:800;}
  p{margin:0;}

  /* ---------- Home ---------- */
  .home-title{text-align:center; margin-top:6px;}
  .home-title .zh{
    font-size:48px; letter-spacing:4px; color:var(--seal);
    text-shadow:0 0 22px rgba(178,58,46,0.55);
  }
  .home-title .sub{font-size:14px; color:var(--gold); letter-spacing:1px; margin-top:2px;}
  .home-tagline{text-align:center; color:#C9C2AC; font-size:13px; margin:12px 0 20px; line-height:1.5;}

  .section-label{font-size:11.5px; color:var(--gold); font-weight:700; letter-spacing:.5px; margin:4px 0 8px;}

  .deck-card{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:14px 16px; margin-bottom:10px;
    border-radius:var(--radius); border:2px solid var(--jade);
    background:linear-gradient(180deg, rgba(47,109,79,0.3), rgba(47,109,79,0.1));
    cursor:pointer; font-family:inherit; color:var(--paper); text-align:left;
  }
  .deck-card.empty{border-color:#5A5647; background:rgba(255,255,255,0.03); cursor:default;}
  .deck-card .dc-name{font-weight:700; font-size:15px;}
  .deck-card .dc-meta{font-size:11.5px; color:#B9B198; margin-top:2px;}
  .deck-card .dc-go{font-size:20px; color:var(--gold);}
  .deck-card.empty .dc-go{display:none;}

  .topic-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; margin-bottom:8px;
    border-radius:12px; border:1.5px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.03); cursor:pointer;
  }
  .topic-row.on{border-color:var(--jade); background:rgba(47,109,79,0.15);}
  .topic-check{
    flex-shrink:0; width:22px; height:22px; border-radius:6px;
    border:2px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:var(--jade-light);
  }
  .topic-row.on .topic-check{border-color:var(--jade-light); background:rgba(95,165,125,0.2);}
  .topic-info{flex:1; min-width:0;}
  .topic-name{font-size:13.5px; font-weight:700; color:var(--paper);}
  .topic-count{font-size:11.5px; color:#9E9880; margin-top:1px;}

  .menu-btn{
    display:block; width:100%; padding:14px 16px; margin-bottom:10px;
    border-radius:var(--radius); border:2px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.04); color:var(--paper);
    font-family:inherit; font-weight:700; font-size:14.5px; text-align:left; cursor:pointer;
  }
  .menu-btn:active{transform:scale(0.98);}
  .menu-btn .desc{display:block; font-weight:500; font-size:12px; color:#B9B198; margin-top:2px;}
  .back-btn{background:none; border:none; color:#C9C2AC; font-family:inherit; font-size:13px; cursor:pointer; padding:6px 0;}
  .topbar{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .progress-pill{
    margin-left:auto; font-size:12px; color:var(--gold);
    background:rgba(212,166,75,0.12); border:1px solid rgba(212,166,75,0.35);
    padding:4px 10px; border-radius:20px;
  }

  /* ---------- 2.5D Battle Stage ---------- */
  #stage{
    position:relative;
    background:linear-gradient(180deg, #0F2620 0%, #1C3E36 38%, #3A5C4C 62%, #7A6B3E 88%, #A98849 100%);
    border:1px solid rgba(212,166,75,0.25);
    border-radius:18px;
    padding:18px 12px 24px;
    margin-bottom:14px;
    overflow:hidden;
    height:280px;
  }
  #stage.shake{animation:sceneShake .3s ease;}
  @keyframes sceneShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);} 50%{transform:translateX(5px);} 75%{transform:translateX(-3px);}
  }
  #stage.flash-good{box-shadow:0 0 0 3px rgba(62,142,92,0.55) inset;}
  #stage.flash-bad{box-shadow:0 0 0 3px rgba(178,58,46,0.55) inset;}

  .cloud-motif{position:absolute; opacity:.14; fill:var(--gold-light); pointer-events:none;}
  .mountain{position:absolute; bottom:70px; left:0; width:100%; pointer-events:none;}
  .lantern{position:absolute; top:-6px; width:22px; height:28px; transform-origin:top center; animation:swing 3.4s ease-in-out infinite;}
  .lantern.right{animation-delay:.6s;}
  @keyframes swing{0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);}}

  .stage-floor{
    position:absolute; left:-15%; right:-15%; bottom:-34px; height:100px;
    background:
      repeating-linear-gradient(90deg, rgba(23,24,27,0.18) 0px, rgba(23,24,27,0.18) 2px, transparent 2px, transparent 36px),
      linear-gradient(180deg, var(--stone) 0%, var(--stone-dark) 100%);
    border-radius:50%; transform:rotateX(60deg); transform-origin:bottom;
    border-top:3px solid rgba(212,166,75,0.3);
  }

  .streak-badge{
    position:absolute; top:10px; right:12px; font-size:11.5px;
    background:rgba(212,166,75,0.15); border:1px solid var(--gold); color:var(--gold);
    padding:3px 9px; border-radius:20px; font-weight:700; opacity:0; transition:opacity .2s ease; z-index:8;
  }
  .streak-badge.show{opacity:1;}

  .fighter-shadow{position:absolute; bottom:50px; width:52px; height:14px; background:radial-gradient(ellipse, rgba(0,0,0,0.55), transparent 75%); border-radius:50%;}
  #playerShadow{left:44px;}
  #enemyShadow{right:44px;}

  .fighter{position:absolute; bottom:58px; width:104px; animation:bob 2.6s ease-in-out infinite;}
  #playerFighter{left:16px;}
  #enemyFighter{right:16px; transform:scaleX(-1);}
  @keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}
  #enemyFighter.float-anim{animation:enemyFloat 2.8s ease-in-out infinite;}
  @keyframes enemyFloat{0%,100%{transform:scaleX(-1) translateY(0);} 50%{transform:scaleX(-1) translateY(-6px);}}

  .p-arm-cast{transform-box:fill-box; transform-origin:15% 20%; transition:transform .3s ease;}
  .e-arm-cast{transform-box:fill-box; transform-origin:85% 20%; transition:transform .3s ease;}
  .p-orb{transform-box:fill-box; transform-origin:50% 50%; opacity:0; transition:opacity .2s ease, transform .2s ease;}
  .e-orb{transform-box:fill-box; transform-origin:50% 50%; opacity:0; transition:opacity .2s ease, transform .2s ease;}

  #playerFighter.charge .p-arm-cast{transform:rotate(-30deg) translate(-3px,-4px);}
  #playerFighter.charge .p-orb{opacity:1; transform:scale(0.6);}
  #playerFighter.release .p-arm-cast{transform:rotate(20deg) translate(6px,2px);}
  #playerFighter.release .p-orb{opacity:0; transform:scale(1.3);}
  #playerFighter.flinch{animation:flinchShake .3s ease;}

  #enemyFighter.charge .e-arm-cast{transform:rotate(30deg) translate(-3px,-4px);}
  #enemyFighter.charge .e-orb{opacity:1; transform:scale(0.6);}
  #enemyFighter.release .e-arm-cast{transform:rotate(-20deg) translate(6px,2px);}
  #enemyFighter.release .e-orb{opacity:0; transform:scale(1.3);}
  #enemyFighter.flinch{animation:flinchShakeMirror .3s ease;}

  @keyframes flinchShake{0%,100%{transform:translateX(0);} 30%{transform:translateX(-7px) rotate(-3deg);} 60%{transform:translateX(4px) rotate(2deg);}}
  @keyframes flinchShakeMirror{0%,100%{transform:scaleX(-1) translateX(0);} 30%{transform:scaleX(-1) translateX(-7px) rotate(3deg);} 60%{transform:scaleX(-1) translateX(4px) rotate(-2deg);}}

  .projectile{position:absolute; top:130px; width:14px; height:14px; border-radius:50%; z-index:5; pointer-events:none;}
  .projectile.jade{background:radial-gradient(circle, #DFF7E8 0%, #4FAE78 55%, #1B4633 100%); box-shadow:0 0 15px 5px rgba(79,174,120,0.8);}
  .projectile.seal{background:radial-gradient(circle, #FCE0DB 0%, #D4574A 55%, #7A2A21 100%); box-shadow:0 0 15px 5px rgba(212,87,74,0.8);}
  .projectile.to-enemy{left:20%; animation:flyR 440ms cubic-bezier(.3,.6,.7,1) forwards;}
  .projectile.to-player{left:80%; animation:flyL 440ms cubic-bezier(.3,.6,.7,1) forwards;}
  @keyframes flyR{
    0%{left:20%; top:130px; transform:scale(.5) rotate(0); opacity:0;}
    10%{opacity:1;}
    45%{left:50%; top:94px; transform:scale(1.15) rotate(200deg);}
    100%{left:72%; top:128px; transform:scale(.9) rotate(400deg); opacity:1;}
  }
  @keyframes flyL{
    0%{left:80%; top:130px; transform:scale(.5) rotate(0); opacity:0;}
    10%{opacity:1;}
    45%{left:50%; top:94px; transform:scale(1.15) rotate(-200deg);}
    100%{left:28%; top:128px; transform:scale(.9) rotate(-400deg); opacity:1;}
  }
  .impact-burst{position:absolute; top:130px; width:44px; height:44px; border-radius:50%; transform:translate(-50%,-50%); animation:burst 380ms ease-out forwards; z-index:6; pointer-events:none;}
  .impact-burst.good{background:radial-gradient(circle, rgba(223,247,232,.95), rgba(79,174,120,.5) 45%, transparent 75%);}
  .impact-burst.bad{background:radial-gradient(circle, rgba(252,224,219,.95), rgba(212,87,74,.5) 45%, transparent 75%);}
  @keyframes burst{0%{opacity:1; transform:translate(-50%,-50%) scale(.2);} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.9);}}

  .hp-block{position:absolute; z-index:3; width:104px;}
  #playerHpBlock{bottom:220px; left:16px;}
  #enemyHpBlock{bottom:220px; right:16px; text-align:right;}
  .hp-track{width:100%; height:10px; background:rgba(0,0,0,0.4); border-radius:8px; overflow:hidden; border:1px solid rgba(255,255,255,0.08);}
  .hp-fill{height:100%; border-radius:8px; transition:width .35s ease;}
  .hp-fill.player{background:linear-gradient(90deg, #3E8E5C, #6FC98A);}
  .hp-fill.enemy{background:linear-gradient(90deg, #8A2C22, #D4574A);}
  .hp-label{font-size:11px; color:#C9C2AC; font-weight:700; margin-top:3px;}

  .fx-layer{position:absolute; bottom:4px; left:0; right:0; text-align:center; height:20px; font-size:12.5px; font-weight:700; z-index:8;}
  .fx-layer.good{color:#7CD99A;}
  .fx-layer.bad{color:#E77C6E;}

  /* ---------- Question card ---------- */
  .qcard{background:var(--paper); color:var(--ink); border-radius:18px; padding:18px 16px 16px; text-align:center; box-shadow:0 10px 28px rgba(0,0,0,0.35);}
  .qcard .type-tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.5px; padding:3px 10px; border-radius:20px; margin-bottom:8px;}
  .type-tag.vocab{background:rgba(47,109,79,0.15); color:var(--jade-dark);}
  .type-tag.grammar{background:rgba(178,58,46,0.15); color:var(--seal-dark);}
  .qcard .prompt-main{font-size:36px; font-weight:700; line-height:1.2;}
  .qcard .prompt-sub{font-size:14px; color:#6B6656; margin-top:4px;}
  .qcard .example{font-size:13px; color:#57523F; margin-top:8px; line-height:1.4; padding:0 4px;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px;}
  .opt-btn{padding:12px 8px; border-radius:12px; border:2px solid #D8D0B8; background:#FBF9F1; color:var(--ink); font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; line-height:1.25;}
  .opt-btn:active{transform:scale(0.97);}
  .opt-btn.correct{background:#DCF0E2; border-color:var(--good); color:var(--jade-dark);}
  .opt-btn.wrong{background:#F6DCD9; border-color:var(--bad); color:var(--seal-dark);}
  .opt-btn:disabled{cursor:default;}
  .continue-btn{margin-top:12px; width:100%; padding:12px; border-radius:12px; border:none; background:var(--ink); color:var(--paper); font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;}

  /* ---------- Result / rest ---------- */
  .center-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px;}
  .center-screen .big-icon{font-size:60px;}
  .center-screen h2{font-size:22px; color:var(--gold);}
  .center-screen .msg{color:#C9C2AC; font-size:13.5px; max-width:320px; line-height:1.5;}
  .result-stats{background:rgba(255,255,255,0.05); border-radius:14px; padding:16px; width:100%; max-width:320px; margin-top:8px;}
  .result-row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:#C9C2AC;}
  .result-row b{color:var(--paper);}
  .weak-list{text-align:left; font-size:12.5px; margin-top:6px; max-height:130px; overflow-y:auto;}
  .weak-item{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.06);}

  /* ---------- Deck / Roster manager ---------- */
  .tab-row{display:flex; gap:6px; margin-bottom:14px;}
  .tab-btn{flex:1; padding:9px 6px; border-radius:10px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.04); color:#C9C2AC; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;}
  .tab-btn.active{border-color:var(--gold); background:rgba(212,166,75,0.15); color:var(--gold);}
  .manager-section{margin-bottom:16px;}
  .manager-section label{font-size:12px; color:var(--gold); font-weight:700; display:block; margin-bottom:6px;}
  textarea{width:100%; min-height:130px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); border-radius:10px; color:var(--paper); font-family:monospace; font-size:12px; padding:10px; resize:vertical;}
  .hint{font-size:11px; color:#8B8570; margin-top:6px; line-height:1.4;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .small-btn{flex:1; padding:10px; border-radius:10px; border:1px solid var(--jade); background:rgba(47,109,79,0.15); color:var(--paper); font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer;}
  .small-btn.warn{border-color:var(--seal); background:rgba(178,58,46,0.15);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--ink); padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:50;}
  .toast.show{opacity:1;}

  .roster-card{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); border-radius:12px; padding:10px; margin-bottom:8px;}
  .roster-card .rc-icon{font-size:24px; width:32px; text-align:center;}
  .roster-card .rc-icon img{width:32px;height:32px;object-fit:cover;border-radius:8px;}
  .roster-card .rc-fields{display:flex; flex-direction:column; gap:5px; flex:1; min-width:0;}
  .roster-card input{flex:1; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.12); border-radius:8px; color:var(--paper); font-family:inherit; font-size:12px; padding:7px 8px; min-width:0;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */

const SAMPLE_DECK = [
  {id:"v1",type:"vocab",hanzi:"你好",pinyin:"nǐ hǎo",meaning:"hello",section:"HSK1 Vocabulary"},
  {id:"v2",type:"vocab",hanzi:"谢谢",pinyin:"xièxie",meaning:"thank you",section:"HSK1 Vocabulary"},
  {id:"v3",type:"vocab",hanzi:"再见",pinyin:"zàijiàn",meaning:"goodbye",section:"HSK1 Vocabulary"},
  {id:"v4",type:"vocab",hanzi:"名字",pinyin:"míngzi",meaning:"name",section:"HSK1 Vocabulary"},
  {id:"v5",type:"vocab",hanzi:"学生",pinyin:"xuésheng",meaning:"student",section:"HSK1 Vocabulary"},
  {id:"v6",type:"vocab",hanzi:"老师",pinyin:"lǎoshī",meaning:"teacher",section:"HSK1 Vocabulary"},
  {id:"v7",type:"vocab",hanzi:"朋友",pinyin:"péngyou",meaning:"friend",section:"HSK1 Vocabulary"},
  {id:"v8",type:"vocab",hanzi:"家",pinyin:"jiā",meaning:"home / family",section:"HSK1 Vocabulary"},
  {id:"v9",type:"vocab",hanzi:"中国",pinyin:"Zhōngguó",meaning:"China",section:"HSK1 Vocabulary"},
  {id:"v10",type:"vocab",hanzi:"北京",pinyin:"Běijīng",meaning:"Beijing",section:"HSK1 Vocabulary"},
  {id:"v11",type:"vocab",hanzi:"苏州",pinyin:"Sūzhōu",meaning:"Suzhou",section:"HSK1 Vocabulary"},
  {id:"v12",type:"vocab",hanzi:"吃",pinyin:"chī",meaning:"to eat",section:"HSK1 Vocabulary"},
  {id:"v13",type:"vocab",hanzi:"喝",pinyin:"hē",meaning:"to drink",section:"HSK1 Vocabulary"},
  {id:"v14",type:"vocab",hanzi:"水",pinyin:"shuǐ",meaning:"water",section:"HSK1 Vocabulary"},
  {id:"v15",type:"vocab",hanzi:"米饭",pinyin:"mǐfàn",meaning:"cooked rice",section:"HSK1 Vocabulary"},
  {id:"v16",type:"vocab",hanzi:"学习",pinyin:"xuéxí",meaning:"to study",section:"HSK1 Vocabulary"},
  {id:"v17",type:"vocab",hanzi:"工作",pinyin:"gōngzuò",meaning:"work / job",section:"HSK1 Vocabulary"},
  {id:"v18",type:"vocab",hanzi:"电话",pinyin:"diànhuà",meaning:"telephone",section:"HSK1 Vocabulary"},
  {id:"v19",type:"vocab",hanzi:"时间",pinyin:"shíjiān",meaning:"time",section:"HSK1 Vocabulary"},
  {id:"v20",type:"vocab",hanzi:"今天",pinyin:"jīntiān",meaning:"today",section:"HSK1 Vocabulary"},
  {id:"v21",type:"vocab",hanzi:"明天",pinyin:"míngtiān",meaning:"tomorrow",section:"HSK1 Vocabulary"},
  {id:"v22",type:"vocab",hanzi:"昨天",pinyin:"zuótiān",meaning:"yesterday",section:"HSK1 Vocabulary"},
  {id:"v23",type:"vocab",hanzi:"天气",pinyin:"tiānqì",meaning:"weather",section:"HSK1 Vocabulary"},
  {id:"v24",type:"vocab",hanzi:"冷",pinyin:"lěng",meaning:"cold",section:"HSK1 Vocabulary"},
  {id:"v25",type:"vocab",hanzi:"热",pinyin:"rè",meaning:"hot",section:"HSK1 Vocabulary"},
  {id:"v26",type:"vocab",hanzi:"高兴",pinyin:"gāoxìng",meaning:"happy",section:"HSK1 Vocabulary"},
  {id:"v27",type:"vocab",hanzi:"喜欢",pinyin:"xǐhuan",meaning:"to like",section:"HSK1 Vocabulary"},
  {id:"v28",type:"vocab",hanzi:"大",pinyin:"dà",meaning:"big",section:"HSK1 Vocabulary"},
  {id:"v29",type:"vocab",hanzi:"小",pinyin:"xiǎo",meaning:"small",section:"HSK1 Vocabulary"},
  {id:"v30",type:"vocab",hanzi:"多",pinyin:"duō",meaning:"many / much",section:"HSK1 Vocabulary"},
  {id:"g1",type:"grammar",hanzi:"是",pinyin:"shì",meaning:"\"to be\" — links identity, name, nationality (often dropped for price/name)",example:"我是学生。 I am a student.",section:"Grammar Points"},
  {id:"g2",type:"grammar",hanzi:"很",pinyin:"hěn",meaning:"\"very\" — default linking word before adjectives, even without real emphasis",example:"我很高兴。 I am (very) happy.",section:"Grammar Points"},
  {id:"g3",type:"grammar",hanzi:"不",pinyin:"bù",meaning:"negation for present / habitual actions",example:"我不喜欢。 I don't like it.",section:"Grammar Points"},
  {id:"g4",type:"grammar",hanzi:"能",pinyin:"néng",meaning:"ability due to circumstance or permission",example:"我今天能去。 I can go today (circumstances allow).",section:"Grammar Points"},
  {id:"g5",type:"grammar",hanzi:"会",pinyin:"huì",meaning:"ability from a learned skill",example:"我会说中文。 I can speak Chinese (I learned it).",section:"Grammar Points"},
  {id:"g6",type:"grammar",hanzi:"可以",pinyin:"kěyǐ",meaning:"permission or possibility",example:"我可以吃吗？ May I eat?",section:"Grammar Points"},

/* ============ STORAGE HELPERS ============ */
let saveTimer = null;
let saveChain = Promise.resolve();
function debouncedSave(key, value){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    saveChain = saveChain.then(()=>window.storage.set(key, JSON.stringify(value)).catch(()=>{}));
  }, 400);
}
async function loadJSON(key, fallback){
  try{
    const r = await window.storage.get(key);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return fallback;
}

let decks = { sample: SAMPLE_DECK.slice(), phrasebook: PHRASEBOOK_DECK.slice(), lessons: LESSONS_DECK.slice() };
let statsByDeck = { sample:{}, phrasebook:{}, lessons:{} };
let enemies = DEFAULT_ENEMIES.map(e=>Object.assign({},e));
let boss = Object.assign({}, DEFAULT_BOSS);

let screen = "home";
let activeDeckKey = "sample";
let managerDeckKey = "sample";
let battle = null;

let pendingDeckKey = null;
let selectedSections = {};

function currentDeck(){ return decks[activeDeckKey] || []; }
function currentStats(){ return statsByDeck[activeDeckKey]; }

function newTermStatsFor(deckKey){
  const s = {};
  (decks[deckKey]||[]).forEach(t=>{ s[t.id] = {seen:0, correct:0}; });
  return s;
}
function ensureStatsFor(deckKey){
  if(!statsByDeck[deckKey]) statsByDeck[deckKey] = {};
  (decks[deckKey]||[]).forEach(t=>{
    if(!statsByDeck[deckKey][t.id]) statsByDeck[deckKey][t.id] = {seen:0, correct:0};
  });
}

function deckSections(deckKey){
  const seen = [], seenSet = new Set();
  (decks[deckKey]||[]).forEach(t=>{
    const sec = t.section || "General";
    if(!seenSet.has(sec)){ seenSet.add(sec); seen.push(sec); }
  });
  return seen;
}

function accuracyFor(terms){
  const stats = currentStats();
  let seen=0, correct=0;
  terms.forEach(t=>{ const s = stats[t.id]; if(s){ seen+=s.seen; correct+=s.correct; } });
  return seen ? correct/seen : 0;
}
function allSeenFor(terms){
  const stats = currentStats();
  return terms.every(t => stats[t.id] && stats[t.id].seen > 0);
}
function weakFor(terms, n){
  const stats = currentStats();
  return terms
    .map(t=>({t, s: stats[t.id] || {seen:0,correct:0}}))
    .filter(x=>x.s.seen>0)
    .sort((a,b)=> (a.s.correct/Math.max(a.s.seen,1)) - (b.s.correct/Math.max(b.s.seen,1)))
    .slice(0,n)
    .map(x=>x.t);
}
function overallAccuracy(){ return accuracyFor(battle.scope); }
function allSeenAtLeastOnce(){ return allSeenFor(battle.scope); }
function weakTerms(n){ return weakFor(battle.scope, n); }

/* ===== Topic selection ===== */
function openTopicSelect(deckKey){
  pendingDeckKey = deckKey;
  const secs = deckSections(deckKey);
  selectedSections = {};
  secs.forEach(s=> selectedSections[s] = true);
  screen = "topicSelect";
  render();
}
function toggleSection(name){
  selectedSections[name] = !selectedSections[name];
  render();
}
function setAllSections(val){
  deckSections(pendingDeckKey).forEach(s=> selectedSections[s] = val);
  render();
}
function selectedSectionCount(){
  const chosen = Object.keys(selectedSections).filter(s=>selectedSections[s]);
  return (decks[pendingDeckKey]||[]).filter(t=> chosen.includes(t.section||"General")).length;
}
function confirmTopicSelect(){
  const chosen = Object.keys(selectedSections).filter(s=>selectedSections[s]);
  const count = (decks[pendingDeckKey]||[]).filter(t=> chosen.includes(t.section||"General")).length;
  if(count < 4){ showToast("Select at least 4 terms' worth of topics."); return; }
  startNewRun(pendingDeckKey, chosen);
}

function startNewRun(deckKey, sections){
  activeDeckKey = deckKey;
  ensureStatsFor(deckKey);
  const full = decks[deckKey] || [];
  const scope = (!sections || sections.length===0) ? full.slice()
    : full.filter(t => sections.includes(t.section||"General"));
  battle = {
    scope: scope,
    sections: sections || null,
    queue: shuffle(scope.map(t=>t.id)),
    enemyIdx: 0,
    enemyHP: enemies[0].hp,
    enemyMaxHP: enemies[0].hp,
    playerHP: PLAYER_MAX_HP,
    streak: 0,
    animating:false,
    phase: "wave",
    bossHP: boss.hp,
    bossMaxHP: boss.hp,
    current: null,
    answered: null,
    fx: "", fxClass: "", flash:""
  };
  nextQuestion();
  screen = "battle";
  render();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function refillQueueIfNeeded(){
  if(battle.queue.length>0) return;
  if(allSeenAtLeastOnce() && overallAccuracy() >= PASS_THRESHOLD && battle.phase==="wave"){
    battle.phase = "boss";
    battle.queue = shuffle(weakTerms(Math.min(10, battle.scope.length)).map(t=>t.id));
    if(battle.queue.length===0) battle.queue = shuffle(battle.scope.map(t=>t.id)).slice(0,8);
    return;
  }
  const stats = currentStats();
  const sorted = battle.scope
    .map(t=>({t, s: stats[t.id] || {seen:0,correct:0}}))
    .sort((a,b)=>{
      const accA = a.s.seen ? a.s.correct/a.s.seen : 0;
      const accB = b.s.seen ? b.s.correct/b.s.seen : 0;
      return accA - accB;
    })
    .map(x=>x.t.id);
  battle.queue = shuffle(sorted);
}

function nextQuestion(){
  refillQueueIfNeeded();
  const id = battle.queue.shift();
  const term = battle.scope.find(t=>t.id===id) || currentDeck().find(t=>t.id===id);
  battle.current = makeQuestion(term);
  battle.answered = null;
}

function makeQuestion(term){
  let pool = battle.scope.filter(t=>t.type===term.type && t.id!==term.id);
  if(pool.length < 3){
    const scopeIds = new Set(battle.scope.map(t=>t.id));
    const extra = currentDeck().filter(t=>t.type===term.type && t.id!==term.id && !scopeIds.has(t.id));
    pool = pool.concat(extra);
  }
  const distractors = shuffle(pool).slice(0,3).map(t=>t.meaning);
  const options = shuffle([term.meaning, ...distractors]);
  return { term, options, correctIndex: options.indexOf(term.meaning) };
}

/* ============ BATTLE ANIMATION FLOW ============ */
function answer(idx){
  if(battle.answered || battle.animating) return;
  const q = battle.current;
  const correct = idx === q.correctIndex;
  battle.answered = {choiceIdx: idx, correct};
  battle.animating = true;
  battle.fx = ""; battle.flash = "";
  render();
  setTimeout(()=>fireProjectile(correct), 200);
}

function fireProjectile(correct){
  const stageEl = document.getElementById("stage");
  if(!stageEl){ resolveImpact(correct); return; }
  const shooter = document.getElementById(correct ? "playerFighter" : "enemyFighter");
  if(shooter) shooter.classList.add("charge");

  setTimeout(()=>{
    if(shooter){ shooter.classList.remove("charge"); shooter.classList.add("release"); }
    const proj = document.createElement("div");
    proj.className = "projectile " + (correct ? "to-enemy jade" : "to-player seal");
    stageEl.appendChild(proj);
    setTimeout(()=>{ if(shooter) shooter.classList.remove("release"); }, 260);

    setTimeout(()=>{
      proj.remove();
      resolveImpact(correct);
    }, 440);
  }, 480);
}

function spawnImpactBurst(correct){
  const stageEl = document.getElementById("stage");
  if(!stageEl) return;
  const burst = document.createElement("div");
  burst.className = "impact-burst " + (correct ? "good" : "bad");
  burst.style.left = correct ? "72%" : "28%";
  stageEl.appendChild(burst);
  setTimeout(()=>burst.remove(), 400);
  const target = document.getElementById(correct ? "enemyFighter" : "playerFighter");
  if(target){ target.classList.add("flinch"); setTimeout(()=>target.classList.remove("flinch"), 320); }
}

function resolveImpact(correct){
  const q = battle.current;
  const stat = currentStats()[q.term.id];
  stat.seen++;
  if(correct) stat.correct++;
  spawnImpactBurst(correct);

  if(correct){
    battle.streak++;
    const dmg = 8 + Math.min(battle.streak-1,5)*2;
    if(battle.phase==="boss") battle.bossHP = Math.max(0, battle.bossHP - dmg);
    else battle.enemyHP = Math.max(0, battle.enemyHP - dmg);
    battle.fx = "+" + dmg + " hit!"; battle.fxClass = "good"; battle.flash = "flash-good";
  } else {
    battle.streak = 0;
    const dmg = 10;
    battle.playerHP = Math.max(0, battle.playerHP - dmg);
    battle.fx = "-" + dmg + " ouch!"; battle.fxClass = "bad"; battle.flash = "flash-bad";
    const stageEl = document.getElementById("stage");
    if(stageEl){ stageEl.classList.add("shake"); setTimeout(()=>stageEl.classList.remove("shake"), 320); }
  }
  battle.animating = false;
  debouncedSave("hanzi_siege_stats", statsByDeck);
  render();
}

function proceedAfterAnswer(){
  if(battle.phase==="boss"){
    if(battle.bossHP<=0){ screen="result"; render(); return; }
  } else {
    if(battle.enemyHP<=0){
      battle.enemyIdx++;
      if(battle.enemyIdx >= enemies.length){
        battle.enemyIdx = enemies.length-1;
      } else {
        battle.enemyHP = enemies[battle.enemyIdx].hp;
        battle.enemyMaxHP = enemies[battle.enemyIdx].hp;
      }
    }
  }
  if(battle.playerHP<=0){ screen="rest"; render(); return; }
  battle.fx=""; battle.flash="";
  nextQuestion();
  render();
}

function restAndContinue(){
  battle.playerHP = PLAYER_MAX_HP;
  screen = "battle";
  nextQuestion();
  render();
}

function characterMarkup(cfg, kindFn){
  if(cfg.img && cfg.img.trim()){
    return `<img src="${escapeAttr(cfg.img)}" alt="${escapeAttr(cfg.name)}" style="width:100%; border-radius:12px;" onerror="this.style.display='none'">`;
  }
  return `<div style="filter:hue-rotate(${cfg.hue||0}deg)">${kindFn()}</div>`;
}
function enemyMarkup(cfg){
  if(cfg.img && cfg.img.trim()){
    return `<img src="${escapeAttr(cfg.img)}" alt="${escapeAttr(cfg.name)}" style="width:100%; border-radius:12px;" onerror="this.style.display='none'">`;
  }
  const fn = cfg.kind==="dragon" ? dragonSVG : (cfg.kind==="guardian" ? guardianSVG : wraithSVG);
  return `<div style="filter:hue-rotate(${cfg.hue||0}deg)">${fn()}</div>`;
}

function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;"); }
function escapeHTML(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ============ RENDER ============ */
const app = document.getElementById("app");
function render(){
  if(screen==="home") return renderHome();
  if(screen==="topicSelect") return renderTopicSelect();
  if(screen==="battle") return renderBattle();
  if(screen==="deckManager") return renderDeckManager();
  if(screen==="roster") return renderRoster();
  if(screen==="result") return renderResult();
  if(screen==="rest") return renderRest();
}

function currentEnemyView(){
  if(battle.phase==="boss") return {cfg:boss, hp:battle.bossHP, max:battle.bossMaxHP};
  return {cfg:enemies[battle.enemyIdx], hp:battle.enemyHP, max:battle.enemyMaxHP};
}

function deckCard(key){
  const meta = DECK_META[key];
  const count = (decks[key]||[]).length;
  const empty = count < 4;
  const secCount = deckSections(key).length;
  const stats = statsByDeck[key] || {};
  let acc = "";
  const seenCount = Object.values(stats).filter(s=>s && s.seen>0).length;
  if(seenCount>0){
    let seen=0, correct=0;
    Object.values(stats).forEach(s=>{ seen+=s.seen; correct+=s.correct; });
    acc = " · " + Math.round((correct/seen)*100) + "% acc";
  }
  return `
    <div class="deck-card ${empty?'empty':''}" onclick="${empty?'':'openTopicSelect(\''+key+'\')'}">
      <div>
        <div class="dc-name">${meta.label}</div>
        <div class="dc-meta">${empty ? "Empty — import terms in Manage Decks" : count + " terms · " + secCount + " topics" + acc}</div>
      </div>
      <div class="dc-go">⚔️</div>
    </div>`;
}

function renderHome(){

    ${DECK_KEYS.map(deckCard).join("")}

    <div class="topbar">
      <button class="back-btn" onclick="screen='home'; render();">← Menu</button>

    <div class="btn-row" style="margin-bottom:12px;">
      <button class="small-btn" onclick="setAllSections(true)">Select all</button>
      <button class="small-btn warn" onclick="setAllSections(false)">Select none</button>
    </div>

function renderRest(){

      <p class="msg">You took too many hits. Catch your breath — your HP resets, but your progress and accuracy stats are kept.</p>

  const acc = Math.round(overallAccuracy()*100);
  const weak = weakTerms(6).filter(t=>{
    const s=currentStats()[t.id]; return s.seen>0 && s.correct/s.seen < 1;
  });
  app.innerHTML = `
    <div class="center-screen">
      <div class="big-icon">🐉➡️🏮</div>

      <div class="result-stats">
        <div class="result-row"><span>Deck</span><b>${DECK_META[activeDeckKey].label}</b></div>
        <div class="result-row"><span>Final accuracy</span><b>${acc}%</b></div>
        <div class="result-row"><span>Terms mastered</span><b>${battle.scope.length}</b></div>

/* ============ Deck Manager ============ */
function deckToText(key){
  let lastSection = null;
  const lines = [];
  (decks[key]||[]).forEach(t=>{
    const sec = t.section || "General";
    if(sec !== lastSection){ lines.push("# " + sec); lastSection = sec; }
    if(t.type==="grammar") lines.push(`grammar\t${t.hanzi}\t${t.pinyin}\t${t.meaning}\t${t.example||""}`);
    else lines.push(`vocab\t${t.hanzi}\t${t.pinyin}\t${t.meaning}`);
  });
  return lines.join("\n");
}

function renderDeckManager(){
  app.innerHTML = `
    <div class="topbar">
      <button class="back-btn" onclick="screen='home'; render();">← Menu</button>
    </div>
    <h3 style="margin-bottom:12px;">📖 Manage decks</h3>
    <div class="tab-row">
      ${DECK_KEYS.map(k=>`<button class="tab-btn ${managerDeckKey===k?'active':''}" onclick="managerDeckKey='${k}'; render();">${DECK_META[k].label}</button>`).join("")}
    </div>
    <div class="manager-section">
      <label>${DECK_META[managerDeckKey].desc}</label>
      <textarea id="deckText">${escapeHTML(deckToText(managerDeckKey))}</textarea>
      <p class="hint">Format — vocab: <code>vocab&nbsp;&nbsp;汉字&nbsp;&nbsp;pinyin&nbsp;&nbsp;meaning</code><br>
      grammar: <code>grammar&nbsp;&nbsp;pattern&nbsp;&nbsp;pinyin&nbsp;&nbsp;meaning&nbsp;&nbsp;example</code><br>
      Start a line with <code>#&nbsp;Topic Name</code> to group the terms below it into a topic/lesson you can filter by in battle. Paste straight from your phrasebook or lesson notes.</p>
      <div class="btn-row">
        <button class="small-btn" onclick="saveDeckFromTextarea()">Save deck</button>
        <button class="small-btn warn" onclick="clearDeck()">Reset to import</button>
      </div>
    </div>
  `;
}

function parseDeckText(text){
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const parsed = [];
  let currentSection = "General";
  lines.forEach((line, i)=>{
    if(line.startsWith("#")){
      currentSection = line.replace(/^#+\s*/,"").trim() || "General";
      return;
    }
    const parts = line.split("\t").map(p=>p.trim());
    if(parts.length<4) return;
    const [type, hanzi, pinyin, meaning, example] = parts;
    if(type!=="vocab" && type!=="grammar") return;
    parsed.push({ id:(type==="grammar"?"g":"v")+i+"_"+Date.now()%100000, type, hanzi, pinyin, meaning, example: example||"", section: currentSection });
  });
  return parsed;
}

function saveDeckFromTextarea(){
  const text = document.getElementById("deckText").value;
  const parsed = parseDeckText(text);
  if(parsed.length < 4){ showToast("Need at least 4 valid rows."); return; }
  decks[managerDeckKey] = parsed;
  statsByDeck[managerDeckKey] = newTermStatsFor(managerDeckKey);
  debouncedSave("hanzi_siege_decks", decks);
  debouncedSave("hanzi_siege_stats", statsByDeck);
  showToast(DECK_META[managerDeckKey].label + " saved — " + parsed.length + " terms.");
  render();
}

const DECK_DEFAULTS = { sample: SAMPLE_DECK, phrasebook: PHRASEBOOK_DECK, lessons: LESSONS_DECK };
function clearDeck(){
  decks[managerDeckKey] = DECK_DEFAULTS[managerDeckKey].slice();
  statsByDeck[managerDeckKey] = newTermStatsFor(managerDeckKey);
  debouncedSave("hanzi_siege_decks", decks);
  debouncedSave("hanzi_siege_stats", statsByDeck);
  screen="deckManager"; render();
  showToast("Reset to the original imported " + DECK_META[managerDeckKey].label + ".");
}

/* ============ Roster Manager ============ */
function rosterIcon(cfg){
  if(cfg.img && cfg.img.trim()) return `<img src="${escapeAttr(cfg.img)}" onerror="this.style.display='none'">`;
  return cfg.icon || "❓";
}
function renderRoster(){
  const rows = enemies.map((e,i)=>`
    <div class="roster-card">
      <div class="rc-icon">${rosterIcon(e)}</div>
      <div class="rc-fields">
        <input value="${escapeAttr(e.name)}" placeholder="Name" oninput="enemies[${i}].name=this.value; saveRosterDebounced();">
        <input value="${escapeAttr(e.icon)}" placeholder="Emoji (fallback label)" oninput="enemies[${i}].icon=this.value; saveRosterDebounced();">
        <input value="${escapeAttr(e.img)}" placeholder="Image URL (optional, replaces art)" oninput="enemies[${i}].img=this.value; render();">
      </div>
    </div>
  `).join("");

  app.innerHTML = `
    <div class="topbar">
      <button class="back-btn" onclick="screen='home'; render();">← Menu</button>
    </div>
    <h3 style="margin-bottom:6px;">🎭 Enemy roster</h3>
    <p class="hint" style="margin-bottom:14px;">Rename any enemy, or paste an image link to replace the vector art — great for turning wave enemies into friends (or the final boss).</p>
    ${rows}
    <div class="roster-card" style="border:1px dashed var(--gold);">
      <div class="rc-icon">${rosterIcon(boss)}</div>
      <div class="rc-fields">
        <input value="${escapeAttr(boss.name)}" placeholder="Boss name" oninput="boss.name=this.value; saveRosterDebounced();">
        <input value="${escapeAttr(boss.icon)}" placeholder="Emoji (fallback label)" oninput="boss.icon=this.value; saveRosterDebounced();">
        <input value="${escapeAttr(boss.img)}" placeholder="Image URL (optional, replaces art)" oninput="boss.img=this.value; render();">
      </div>
    </div>
    <div class="btn-row">
      <button class="small-btn warn" onclick="resetRoster()">Reset roster</button>
    </div>
  `;
}

function saveRosterDebounced(){ debouncedSave("hanzi_siege_roster", {enemies, boss}); }
function resetRoster(){
  enemies = DEFAULT_ENEMIES.map(e=>Object.assign({},e));
  boss = Object.assign({}, DEFAULT_BOSS);
  saveRosterDebounced();
  screen="roster"; render();
  showToast("Roster reset.");
}

/* ============ Toast ============ */
let toastTimer=null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

/* ============ INIT ============ */
async function init(){
  const savedDecks = await loadJSON("hanzi_siege_decks", null);
  if(savedDecks){
    DECK_KEYS.forEach(k=>{ if(Array.isArray(savedDecks[k])) decks[k] = savedDecks[k]; });
  }
  const savedStats = await loadJSON("hanzi_siege_stats", null);
  if(savedStats){
    DECK_KEYS.forEach(k=>{ if(savedStats[k]) statsByDeck[k] = savedStats[k]; });
  }
  const savedRoster = await loadJSON("hanzi_siege_roster", null);
  if(savedRoster && savedRoster.enemies){
    enemies = savedRoster.enemies;
    boss = savedRoster.boss || boss;
  }
  render();
}
init();
</script>
