<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>从零开始 · Chinese Basics — A Lesson Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20211d;
    --paper:#f3f1ea;
    --paper-raised:#faf9f4;
    --line:#d8d4c6;
    --jade:#3f6659;
    --jade-dim:#e4ece9;
    --seal:#a8342a;
    --seal-dim:#f2e1de;
    --canal:#4a6473;
    --canal-dim:#e6ebed;
    --muted:#7a7666;
    --tier1:#3f6659;
    --tier2:#b2822e;
    --tier3:#a8342a;

    --c-pronoun:#4a5f7a;
    --c-verb:#a8342a;
    --c-noun:#3f6659;
    --c-particle:#7b5ea7;
    --c-question:#b2822e;
    --c-measure:#2e7c8a;
    --c-adjective:#8a7b3f;
    --c-negation:#8c4a4a;
    --c-aux:#b2622e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .app{max-width:1120px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:24px;transition:max-width .18s ease;}
  .app.mobile-mode{max-width:560px;}

  /* HEADER */
  header{padding:18px 16px 10px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .brand h1{font-family:'Baloo 2',sans-serif;font-size:23px;font-weight:700;margin:0;letter-spacing:0.2px;}
  .brand .cn{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;}
  .subtitle{font-size:12px;color:var(--muted);margin:2px 0 0;line-height:1.5;}
  .header-btns{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .layout-toggle{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);}
  .switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch-slider{position:absolute;inset:0;background:var(--line);transition:.2s;border-radius:20px;cursor:pointer;}
  .switch-slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;top:3px;background:#fff;transition:.2s;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .switch input:checked + .switch-slider{background:var(--canal);}
  .switch input:checked + .switch-slider:before{transform:translateX(16px);}
  .pron-toggle-btn, .legend-btn{
    background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:14px;font-size:12px;padding:5px 10px;cursor:pointer;
  }
  .pron-toggle-btn.active{background:var(--canal);border-color:var(--canal);color:#fff;}
  .speed-control{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .speed-btn{background:none;border:none;border-right:1px solid var(--line);color:var(--muted);
    font-size:11.5px;padding:5px 9px;cursor:pointer;}
  .speed-btn:last-child{border-right:none;}
  .speed-btn.active{background:var(--jade);color:#fff;}

  /* LEGEND / COLOR KEY MODAL */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:50;align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:var(--paper-raised);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 18px 28px;max-height:75vh;overflow-y:auto;}
  .sheet h3{margin:0 0 12px;font-family:'Baloo 2',sans-serif;}
  .legend-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .legend-item .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .sheet-close{display:block;width:100%;text-align:center;margin-top:14px;padding:10px;background:var(--jade);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;}

  /* SEARCH */
  .searchbar{display:flex;align-items:center;background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:10px;}
  .searchbar input{border:none;background:none;outline:none;flex:1;font-size:15px;color:var(--ink);font-family:inherit;}
  .searchbar input::placeholder{color:var(--muted);}
  .searchbar svg{margin-right:8px;flex-shrink:0;}
  .search-result-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;}
  .search-result-card:hover{border-color:var(--jade);}
  .sr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .sr-kind{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#fff;background:var(--canal);border-radius:8px;padding:2px 7px;flex-shrink:0;}
  .sr-lesson{font-size:11px;color:var(--muted);}
  .sr-hanzi{font-family:'Baloo 2',sans-serif;font-size:17px;margin:2px 0;}
  .sr-pinyin{font-size:12.5px;color:var(--muted);font-style:italic;}
  .sr-en{font-size:12.5px;color:var(--ink);margin-top:2px;}
  .pron-box{
    margin-top:8px;background:var(--canal-dim);border-left:3px solid var(--canal);
    border-radius:8px;padding:8px 10px;
  }
  .pron-sounds-like{font-size:12.5px;font-weight:600;color:var(--seal);margin-bottom:4px;}
  .pron-tones{font-size:12px;font-weight:600;color:var(--canal);margin-bottom:4px;}
  .pron-tip{font-size:11.5px;color:var(--ink);line-height:1.5;margin-top:2px;}
  .pron-tip-warn{font-size:11.5px;color:var(--tier2);font-weight:600;line-height:1.5;margin-top:2px;padding-bottom:4px;border-bottom:1px dashed var(--line);}
  .pron-tip-warn b{color:var(--tier2);}

  main{padding:0 16px;}
  .app:not(.mobile-mode) main{max-width:900px;margin:0 auto;padding:0 32px;}
  .app:not(.mobile-mode) .lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .app:not(.mobile-mode) .lesson-card{margin-bottom:0;}
  .app:not(.mobile-mode) .gp-example{align-items:flex-start;}

  /* PROGRESS CARD */
  .progress-card{background:var(--jade);color:#fff;border-radius:16px;padding:14px 18px;margin:14px 0;}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-top .num{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;}
  .progress-top .lbl{font-size:11.5px;opacity:0.85;}
  .progress-track{height:8px;background:rgba(255,255,255,0.25);border-radius:5px;overflow:hidden;}
  .progress-fill{height:100%;background:#fff;border-radius:5px;transition:width 0.3s;}

  /* LESSON LIST CARDS */
  .lesson-card{display:flex;align-items:center;gap:12px;background:var(--paper-raised);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .lesson-card.done{border-color:var(--jade);background:var(--jade-dim);}
  .lesson-num{font-family:'Baloo 2',sans-serif;width:38px;height:38px;border-radius:50%;
    background:var(--paper);border:2px solid var(--jade);color:var(--jade);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
  .lesson-card.done .lesson-num{background:var(--jade);color:#fff;}
  .lesson-body{flex:1;min-width:0;}
  .lesson-title{font-family:'Baloo 2',sans-serif;font-size:15.5px;font-weight:600;margin:0 0 2px;}
  .lesson-cn{font-size:12px;color:var(--muted);margin:0 0 4px;}
  .lesson-tags{display:flex;flex-wrap:wrap;gap:5px;}
  .lesson-tag{font-size:10px;background:var(--tier2);color:#fff;opacity:0.85;border-radius:10px;padding:2px 8px;}
  .lesson-check{font-size:18px;color:var(--jade);flex-shrink:0;}
  .lesson-chevron{color:var(--muted);flex-shrink:0;}

  /* LESSON DETAIL NAV */
  .back-row{display:flex;align-items:center;gap:8px;padding:14px 0 0;}
  .back-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;
    background:var(--paper-raised);border:1px solid var(--line);color:var(--jade);cursor:pointer;flex-shrink:0;}
  .lesson-header{padding:10px 0 4px;}
  .lesson-header .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
  .lesson-header h2{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:700;margin:2px 0 2px;}
  .lesson-header .cn-title{font-size:13.5px;color:var(--muted);}

  .block{margin:22px 0 0;}
  .block-title{
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;
    font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:800;color:var(--jade);
    letter-spacing:0.3px;margin-bottom:12px;padding-bottom:8px;border-bottom:2.5px solid var(--jade);
  }
  .block-title .bt-chevron{transition:transform .2s ease;flex-shrink:0;color:var(--jade);}
  .block-title.collapsed .bt-chevron{transform:rotate(-90deg);}
  .block-title.collapsed{margin-bottom:0;}
  .block-content{overflow:hidden;}
  .block-content.collapsed{display:none;}

  /* LESSON INTRO / OBJECTIVES */
  .intro-card{background:var(--jade-dim);border:1.5px solid var(--jade);border-radius:14px;padding:14px 16px;margin:16px 0 0;}
  .intro-card .intro-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--jade);font-weight:800;margin-bottom:6px;}
  .intro-card ul{margin:0;padding-left:18px;}
  .intro-card li{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:2px;}

  /* SPIRAL CALLBACK */
  .spiral-box{background:var(--canal-dim);border-left:3px solid var(--canal);border-radius:8px;
    padding:10px 12px;font-size:12.5px;color:var(--ink);line-height:1.5;}
  .spiral-box b{color:var(--canal);}

  /* Inline Chinese term + highlighted construction rules, used inside grammar prose */
  .cn-inline{font-weight:700;color:var(--jade);white-space:nowrap;}
  .gp-highlight{background:var(--jade-dim);color:var(--jade);padding:1px 6px;border-radius:5px;font-weight:700;white-space:nowrap;}

  /* ============ PHRASE CARD (ported directly from the phrasebook) ============ */
  .phrase-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .phrase-speaker{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:0.5px;
    background:var(--jade);color:#fff;border-radius:6px;padding:2px 8px;margin-bottom:8px;
  }
  .phrase-speaker.b{background:var(--tier2);}
  .phrase-en{font-size:16.5px;font-weight:600;color:var(--ink);margin:0 0 8px;}
  .phrase-row{display:flex;align-items:flex-start;gap:10px;}
  .phrase-cn{font-size:24px;line-height:1.5;flex:1;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;}
  .tok{cursor:default;border-bottom:2px solid transparent;padding-bottom:1px;}
  .seal-btn{position:relative;flex-shrink:0;width:42px;height:42px;border-radius:8px;background:var(--seal);color:#f3ece9;
    border:none;font-size:13px;font-weight:600;font-family:"PingFang SC","Noto Sans SC",sans-serif;
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,0.15) inset;}
  .seal-btn:active{transform:scale(0.94);}
  .seal-btn.playing{background:var(--jade);}
  .seal-btn.has-warn{box-shadow:0 0 0 2px var(--tier2);}
  .warn-dot-round{
    position:absolute;top:-4px;right:-4px;
    background:var(--paper);color:var(--tier2);
    border:1px solid var(--tier2);border-radius:50%;
    width:16px;height:16px;font-size:9px;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }

  /* pinyin line — enlarged for prominence */
  .phrase-pinyin{font-size:19px;font-weight:700;color:var(--jade);margin:8px 0 0;font-style:italic;}

  /* word-by-word breakdown — enlarged per request */
  .breakdown{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
  .tok-chip{display:flex;flex-direction:column;align-items:center;min-width:68px;padding:8px 10px;
    border-radius:9px;background:var(--paper);border:1px solid var(--line);}
  .tok-chip .h{font-size:19px;font-weight:600;}
  .tok-chip .p{font-size:13px;color:var(--muted);margin-top:2px;}
  .tok-chip .g{font-size:14px;color:var(--ink);margin-top:3px;text-align:center;line-height:1.35;}
  .tok-chip .dot{width:6px;height:6px;border-radius:50%;margin-top:5px;}
  .tok-chip .r{font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--muted);margin-top:3px;text-align:center;}
  .chip-audio-btn{
    margin-top:6px;background:none;border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;font-size:12px;cursor:pointer;color:var(--jade);line-height:1.4;
  }
  .chip-audio-btn:active{background:var(--jade-dim);}
  .chip-audio-btn.playing{background:var(--jade);color:#fff;border-color:var(--jade);}
  .chip-audio-btn.has-warn{border-color:var(--tier2);color:var(--tier2);}
  .warn-dot{color:var(--tier2);font-size:8px;margin-left:1px;vertical-align:super;}
  .tone-badge{
    font-size:8.5px;color:var(--canal);background:var(--canal-dim);
    border-radius:6px;padding:1px 5px;margin-top:4px;white-space:nowrap;
  }
  .sounds-like{
    font-size:9.5px;color:var(--seal);font-weight:700;
    margin-top:3px;white-space:nowrap;
  }
  .chip-info-btn{
    margin-top:4px;width:16px;height:16px;border-radius:50%;
    border:1px solid var(--canal);color:var(--canal);background:none;
    font-size:9px;line-height:1;cursor:pointer;padding:0;
  }
  .chip-tip{
    font-size:10px;color:var(--ink);line-height:1.4;margin-top:5px;
    max-width:150px;text-align:left;background:var(--paper-raised);
    border:1px solid var(--line);border-radius:6px;padding:6px 7px;display:none;
  }
  .chip-tip.show{display:block;}
  .chip-info-btn.has-warn{border-color:var(--tier2);color:var(--tier2);}
  .chip-tip-warn{color:var(--tier2);font-weight:600;padding-bottom:5px;margin-bottom:5px;border-bottom:1px dashed var(--line);}
  .chip-tip-warn b{color:var(--tier2);}

  .tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .gram-pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid;cursor:pointer;background:none;}
  .gram-pill.t1{color:var(--tier1);border-color:var(--tier1);}
  .gram-pill.t2{color:var(--tier2);border-color:var(--tier2);}
  .gram-pill.t3{color:var(--tier3);border-color:var(--tier3);}
  .gram-tip{font-size:12.5px;color:var(--ink);background:var(--jade-dim);border-radius:8px;padding:8px 10px;margin-top:8px;display:none;}
  .gram-tip.show{display:block;}
  .gram-tip b{color:var(--jade);}

  .structure-box{background:var(--canal-dim);border-left:3px solid var(--canal);border-radius:8px;
    padding:8px 11px;margin-top:12px;}
  .structure-box .sb-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--canal);font-weight:800;margin-bottom:3px;}
  .structure-box .sb-text{font-size:12.5px;color:var(--ink);line-height:1.5;}
  .structure-box .sb-text b{color:var(--canal);}
  .structure-box .sb-slot{font-weight:700;color:var(--jade);}

  /* ============ GRAMMAR POINT (Integrated-Chinese-style deep dive) ============ */
  .gp-card{background:var(--paper-raised);border:2px solid var(--jade);border-radius:14px;padding:0;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 8px rgba(63,102,89,0.12);}
  .gp-head{background:var(--jade);color:#fff;padding:13px 16px;}
  .gp-head .gp-num{font-family:'Baloo 2',sans-serif;font-size:13px;opacity:0.9;}
  .gp-head .gp-title{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:800;margin:2px 0 0;}
  .gp-body{padding:14px 16px;}
  .gp-structure{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .gp-structure b{color:var(--ink);}
  .gp-example{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .gp-example .gp-letter{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--jade-dim);color:var(--jade);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .gp-example .gp-ex-body{flex:1;}
  .gp-ex-cn{font-size:19px;line-height:1.4;font-family:"PingFang SC","Noto Sans SC",sans-serif;}
  .gp-ex-cn .tok{margin-right:0;}
  .gp-ex-pinyin{font-size:16px;color:var(--jade);font-style:italic;font-weight:700;margin:4px 0;}
  .gp-ex-en{font-size:12.5px;color:var(--muted);}
  .gp-mistake{
    background:var(--seal-dim);border-radius:8px;padding:9px 11px;margin:10px 0;
    font-size:12.5px;color:var(--ink);line-height:1.5;
  }
  .gp-mistake .x{color:var(--seal);font-weight:700;}
  .gp-note{font-size:12.5px;color:var(--ink);line-height:1.5;margin:8px 0;}
  .gp-exercise{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;}
  .gp-exercise .ex-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:6px;}
  .gp-exercise .ex-q{font-size:14.5px;margin-bottom:6px;}
  .gp-exercise .ex-reveal{font-size:12px;background:var(--jade);color:#fff;border:none;border-radius:7px;padding:6px 11px;cursor:pointer;}
  .gp-exercise .ex-a{font-size:14px;color:var(--jade);margin-top:8px;display:none;font-weight:600;}
  .gp-exercise .ex-a.show{display:block;}

  /* ============ LANGUAGE NOTES ============ */
  .lang-note{display:flex;gap:10px;margin-bottom:12px;}
  .lang-note .ln-letter{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--seal-dim);color:var(--seal);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .lang-note .ln-body{flex:1;}
  .lang-note .ln-term{font-size:14px;font-weight:700;color:var(--seal);margin:0 0 1px;}
  .lang-note .ln-pinyin{font-size:15px;font-style:italic;color:var(--jade);font-weight:700;margin:0 0 4px;}
  .lang-note .ln-text{font-size:12.5px;color:var(--ink);line-height:1.55;margin:0;}

  /* ============ VERB SPOTLIGHT ============ */
  .verb-spot{background:linear-gradient(135deg,var(--tier2),#c99a4a);
    border-radius:14px;padding:16px;color:#fff;margin-bottom:14px;}
  .verb-spot .vs-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;opacity:0.85;margin-bottom:4px;}
  .verb-spot .vs-hanzi{font-family:"PingFang SC","Noto Sans SC",sans-serif;font-size:32px;font-weight:600;}
  .verb-spot .vs-pinyin{font-size:18px;opacity:0.95;margin:2px 0 8px;font-style:italic;font-weight:700;}
  .verb-spot .vs-gloss{font-size:13px;margin-bottom:10px;}
  .verb-spot .vs-patterns{border-top:1px solid rgba(255,255,255,0.3);padding-top:10px;}
  .verb-spot .vs-pattern{font-size:13.5px;margin-bottom:8px;line-height:1.6;}
  .verb-spot .vs-pattern .vp-cn{font-weight:600;font-size:16px;}
  .verb-spot .vs-pattern .vp-pinyin{font-weight:700;color:#fff;font-style:italic;}
  .verb-spot .vs-audio{
    margin-top:8px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.5);
    color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;
  }
  .verb-spot .vs-audio.has-warn{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,0.6);}
  .verb-spot .vs-audio .warn-dot{color:#fff;}
  .verb-spot .vs-audio-warn{margin-top:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,0.15);border-radius:7px;padding:6px 9px;line-height:1.5;}
  .verb-spot .vs-audio-warn b{font-weight:800;}

  /* ============ VOCABULARY TABLE ============ */
  .vocab-table{width:100%;border-collapse:collapse;font-size:13px;}
  .vocab-table th{
    text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);
    padding:0 8px 6px;border-bottom:1px solid var(--line);font-weight:700;
  }
  .vocab-table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .vocab-table tr:last-child td{border-bottom:none;}
  .vocab-table .vt-hanzi{font-size:19px;font-family:"PingFang SC","Noto Sans SC",sans-serif;white-space:nowrap;}
  .vocab-table .vt-pinyin{color:var(--jade);font-style:italic;font-size:15.5px;font-weight:700;}
  .vocab-table .vt-pos{color:var(--muted);font-size:11px;white-space:nowrap;}
  .vocab-table .vt-def{color:var(--ink);font-size:12.5px;}
  .vocab-table .vt-audio{
    position:relative;width:28px;height:28px;border-radius:50%;border:none;background:var(--seal);color:#fff;
    font-size:11px;cursor:pointer;flex-shrink:0;
  }
  .vocab-table .vt-audio.has-warn{box-shadow:0 0 0 2px var(--tier2);}
  .vocab-table .vt-audio .warn-dot-round{width:13px;height:13px;font-size:7.5px;top:-3px;right:-3px;}

  /* ============ YOUR TURN ============ */
  .yt-card{background:#ece7f5;border:1px solid var(--c-particle);border-radius:12px;padding:13px 15px;margin-bottom:10px;}
  .yt-prompt{font-size:13.5px;font-weight:600;color:var(--ink);margin:0 0 10px;}
  .yt-reveal-btn{font-size:12.5px;background:var(--c-particle);color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;}
  .yt-answer{margin-top:10px;padding-top:10px;border-top:1px dashed var(--c-particle);display:none;}
  .yt-answer.show{display:block;}

  /* CROSS LINK */
  .crosslink{font-size:12px;color:var(--muted);font-style:italic;padding:10px 12px;background:var(--paper-raised);border-radius:8px;}

  /* COMPLETE / NAV */
  .complete-row{margin:22px 0 0;}
  .complete-btn{width:100%;padding:13px;border-radius:12px;border:2px solid var(--jade);
    background:var(--paper-raised);color:var(--jade);font-size:14px;font-weight:600;cursor:pointer;}
  .complete-btn.done{background:var(--jade);color:#fff;}
  .lesson-nav{display:flex;gap:10px;margin:12px 0 0;}
  .lesson-nav button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--ink);font-size:13.5px;cursor:pointer;}
  .lesson-nav button:disabled{opacity:0.35;pointer-events:none;}

  /* ============ PHONETICS LESSON (Lesson 0) ============ */
  .tone-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:4px;}
  .tone-cell{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;}
  .tone-cell .t-hanzi{font-size:22px;}
  .tone-cell .t-pinyin{font-size:13px;color:var(--jade);margin-top:2px;font-weight:600;font-style:italic;}
  .tone-cell .t-gloss{font-size:10px;color:var(--muted);margin-top:2px;}
  .tone-cell .t-num{font-size:9.5px;color:var(--muted);margin-top:3px;}
  .trap-row{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .trap-row .tr-pair{font-size:13.5px;font-weight:700;color:var(--jade);}
  .trap-row .tr-note{font-size:12.5px;color:var(--ink);margin-top:3px;line-height:1.55;}

  .empty{font-size:13px;color:var(--muted);text-align:center;padding:30px 10px;}
</style>
</head>
<body>

    <div class="brand"><h1>从零开始 <span class="cn">Chinese Basics</span></h1></div>

  </header>

  <main id="main"></main>

  <div class="sheet" id="sheetContent"></div>

<script>
// ============ ROLE COLORS (exact match to phrasebook) ============
const ROLES = {
  pronoun:   {color:'var(--c-pronoun)',   label:'Pronoun (I / you / he...)', short:'Pronoun'},
  verb:      {color:'var(--c-verb)',      label:'Verb', short:'Verb'},
  noun:      {color:'var(--c-noun)',      label:'Noun / object', short:'Noun'},
  particle:  {color:'var(--c-particle)',  label:'Particle / grammar word', short:'Particle'},
  question:  {color:'var(--c-question)',  label:'Question word', short:'Question word'},
  measure:   {color:'var(--c-measure)',   label:'Number / measure word', short:'Measure word'},
  adjective: {color:'var(--c-adjective)', label:'Adjective', short:'Adjective'},
  negation:  {color:'var(--c-negation)',  label:'Negation', short:'Negation'},
  aux:       {color:'var(--c-aux)',       label:'Auxiliary verb (want/can/will)', short:'Auxiliary verb'}
};
function tok(hanzi, pinyin, gloss, role){
  return {hanzi, pinyin, gloss, role: role || 'noun'};
}
function toksToHanzi(toks){ return toks.map(t => t.hanzi).join(''); }
function toksToPinyin(toks){ return toks.map(t => t.pinyin).join(' · '); }

// ============ PRONUNCIATION GUIDE ENGINE (same as phrasebook) ============
function stripTonesAndGetTones(pinyinRaw){
  const toneMap = {
    'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],
    'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
    'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],
    'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
    'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],
    'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4]
  };
  let plain = '';
  const tones = [];
  for (const ch of pinyinRaw){
    if (toneMap[ch]){
      plain += toneMap[ch][0];
      tones.push(toneMap[ch][1]);
    } else if (/[a-züA-ZÜ]/.test(ch)){
      plain += ch.toLowerCase();
    }
  }
  return {plain, tones};
}

// ============ PINYIN -> ENGLISH-SOUNDS-LIKE APPROXIMATION ============
const PY_INITIALS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const PY_FINALS = [
  'iang','iong','uang','ueng',
  'ian','iao','uai','uan','ing','ong','ang','eng',
  'ai','ei','ao','ou','an','en','er','ia','ie','iu','ua','uo','ui','ue','ve','un','in',
  'a','o','e','i','u','v','n','ng'
];
function splitPySyllables(word){
  const syllables = [];
  let i = 0;
  while (i < word.length){
    let matched = false;
    for (const init of PY_INITIALS){
      if (word.startsWith(init, i)){
        for (const fin of PY_FINALS){
          if (fin.length && word.startsWith(fin, i + init.length)){
            syllables.push(init + fin);
            i += init.length + fin.length;
            matched = true;
            break;
          }
        }
        if (matched) break;
      }
    }
    if (matched) continue;
    for (const fin of PY_FINALS){
      if (fin.length && word.startsWith(fin, i)){
        syllables.push(fin);
        i += fin.length;
        matched = true;
        break;
      }
    }
    if (matched) continue;
    syllables.push(word[i]);
    i += 1;
  }
  return syllables;
}
const PY_INITIAL_SOUND = {
  '':'', 'b':'b','p':'p','m':'m','f':'f','d':'d','t':'t','n':'n','l':'l',
  'g':'g','k':'k','h':'h','j':'j','q':'ch','x':'sh',
  'zh':'j','ch':'ch','sh':'sh','r':'r','z':'dz','c':'ts','s':'s','y':'y','w':'w'
};
const PY_FINAL_SOUND = {
  'a':'ah','o':'aw','e':'uh','i':'ee','u':'oo','v':'ü','n':'n','ng':'ng',
  'ai':'eye','ei':'ay','ao':'ow','ou':'oh','an':'ahn','en':'un','er':'are',
  'ia':'yah','ie':'yeh','iu':'yo','ua':'wah','uo':'waw','ui':'way','ue':'yweh','ve':'yweh',
  'un':'wun','in':'een',
  'ang':'ahng','eng':'ung',
  'ian':'yen','iao':'yow','uai':'why','uan':'wahn','ing':'ing','ong':'oong',
  'iang':'yahng','iong':'yoong','uang':'wahng','ueng':'wung'
};
const PY_SYLLABLE_OVERRIDES = {
  'zhi':'jr', 'chi':'chr', 'shi':'shr', 'ri':'rr',
  'zi':'dzuh', 'ci':'tsuh', 'si':'suh',
  'yi':'ee', 'wu':'woo', 'yu':'yew',
  'er':'are', 'e':'uh', 'a':'ah', 'o':'aw',
  'yan':'yen', 'yang':'yahng', 'ye':'yeh', 'yao':'yow', 'you':'yo',
  'ying':'ing', 'yong':'yoong', 'yin':'een', 'yue':'yweh', 'yuan':'ywen', 'yun':'ywun',
  'wa':'wah', 'wo':'waw', 'wai':'why', 'wei':'way', 'wan':'wahn', 'wang':'wahng', 'wen':'wun', 'weng':'wung'
};
function pySyllableToEnglish(syl){
  if (PY_SYLLABLE_OVERRIDES[syl] !== undefined) return PY_SYLLABLE_OVERRIDES[syl];
  for (const init of PY_INITIALS){
    if (syl.startsWith(init) && init.length){
      const rest = syl.slice(init.length);
      if (PY_FINAL_SOUND[rest] !== undefined){
        let initSound = PY_INITIAL_SOUND[init];
        let finalSound = PY_FINAL_SOUND[rest];
        if (['j','q','x'].includes(init) && rest === 'u') finalSound = 'ü';
        if (['j','q','x'].includes(init) && rest === 'un') finalSound = 'ün';
        if (['j','q','x'].includes(init) && rest === 'uan') finalSound = 'wen';
        return initSound + finalSound;
      }
    }
  }
  if (PY_FINAL_SOUND[syl] !== undefined) return PY_FINAL_SOUND[syl];
  return syl;
}
// Embedded English proper nouns (Julien, Anna...) have no tone marks and start capitalized — skip these.
function looksLikeEmbeddedEnglish(word){
  return /^[A-Z]/.test(word) && !/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(word);
}
function pinyinToEnglishApprox(pinyinRaw){
  const rawWords = pinyinRaw.split(/[\s'’\-]+/).filter(Boolean);
  const approxWords = rawWords.map(rw => {
    if (looksLikeEmbeddedEnglish(rw)) return null;
    const {plain} = stripTonesAndGetTones(rw);
    if (!plain) return null;
    const syls = splitPySyllables(plain);
    return syls.map(pySyllableToEnglish).join('-');
  });
  if (approxWords.some(w => w === null)) return null;
  return approxWords.join(' ');
}

function computeTips(pinyinText){
  const {plain, tones} = stripTonesAndGetTones(pinyinText);
  const tips = [];
  const seen = new Set();
  let working = plain;

  [
    ['zh',"zh — like the 'j' in judge, but tongue curled back (retroflex)."],
    ['ch',"ch — like the 'ch' in church, but tongue curled back (retroflex)."],
    ['sh',"sh — like English 'sh', but tongue curled back (retroflex)."]
  ].forEach(([pat, tip]) => {
    if (working.includes(pat)){ tips.push(tip); seen.add(tip); working = working.split(pat).join(''); }
  });

  [
    ['q',"q — like 'ch' in 'cheese', but tongue tip down, front of the mouth — lighter than English ch."],
    ['x',"x — a soft, hissy 'sh' made with a flat tongue near the front — not like English 'sh'."],
    ['j',"j — like the 'j' in 'jeep', but tongue flat, front of the mouth."],
    ['r',"r — between English 'r' and 'zh'; tongue curled back with a slight buzz, no lip rounding."],
    ['c',"c — like the 'ts' in 'cats', with a puff of air."],
    ['z',"z — like the 'ds' in 'kids', tongue flat against the back of the teeth."]
  ].forEach(([pat, tip]) => {
    if (working.includes(pat) && !seen.has(tip)){ tips.push(tip); seen.add(tip); }
  });

  [
    ['ang',"ang — 'ah' plus a nasal ending; the tongue never touches the roof of the mouth."],
    ['eng',"eng — like the 'ung' in 'sung'."],
    ['ong',"ong — rounded lips, like 'oong'."],
    ['ie',"ie — like the 'ye' in 'yes'."],
    ['ui',"ui — like the word 'way'."],
    ['iu',"iu — like the 'yo' in 'yo-yo'."],
    ['er',"er — tongue curled back, like the 'ar' in American 'butter'."]
  ].forEach(([pat, tip]) => {
    if (plain.includes(pat) && !seen.has(tip)){ tips.push(tip); seen.add(tip); }
  });

  if (/[jqxy]u/.test(plain)){
    const tip = "ü — round your lips as if saying 'oo', but say 'ee'; no English equivalent. (Written as plain u after j/q/x/y.)";
    if (!seen.has(tip)){ tips.push(tip); seen.add(tip); }
  }

  if (['zhi','chi','shi','ri','zi','ci','si'].some(s => plain.includes(s))){
    const tip = "i after zh/ch/sh/r/z/c/s isn't the 'ee' sound it is everywhere else — it's a buzzy, near-vowel-less continuation of the consonant, closer to \"-r\" or \"-zzz\" than \"-ee\".";
    tips.push(tip);
  }

  const toneShapes = {1:'flat & high',2:'rising',3:'dip then rise',4:'sharp fall'};
  let toneSummary = '';
  if (tones.length){
    toneSummary = tones.map(t => t + (toneShapes[t] ? ' (' + toneShapes[t] + ')' : '')).join(' · ');
  } else if (/[a-züAEIOU]/i.test(plain)){
    toneSummary = 'neutral (light, no strong pitch)';
  }
  return {tips, toneSummary};
}
// ============ AUDIO RELIABILITY WARNINGS ============
// The 🔊 buttons use the device's built-in Web Speech API voice, not a native recording.
// For a handful of sound families that voice is a genuinely bad model of the real sound —
// this flags exactly which syllable is the problem and what to listen for instead, rather
// than a blanket disclaimer.
const AUDIO_WARN_BUZZED_I = {
  'zhi': 'Audio will likely say "-ee" here. The real sound has no vowel at all — it\'s "zh" buzzed on with the tongue still curled back, closer to "jrr" than "jee".',
  'chi': 'Audio will likely say "-ee" here. The real sound has no vowel at all — it\'s "ch" buzzed on (with a puff of air) tongue still curled back, closer to "chrr" than "chee".',
  'shi': 'Audio will likely say "-ee" here. The real sound has no vowel at all — it\'s "sh" buzzed on with the tongue still curled back, closer to "shrr" than "shee".',
  'ri': 'Audio will likely say "-ee" here. The real sound has no vowel at all — it\'s a buzzed "r" held on its own, closer to "rrr" than "ree".',
  'zi': 'Audio will likely say "-ee" here. The real sound has no vowel at all — it\'s a flat buzz continuing "z", tongue against the back of the teeth, closer to "dzz" than "dzee".',
  'ci': 'Audio will likely say "-ee" here. The real sound has no vowel at all — it\'s a flat buzz continuing "c" (with a puff of air), closer to "tss" than "tsee".',
  'si': 'Audio will likely say "-ee" here. The real sound has no vowel at all — it\'s a flat buzz continuing "s", closer to "sss" than "see".',
};
function getAudioWarning(pinyinRaw){
  if (!pinyinRaw || looksLikeEmbeddedEnglish(pinyinRaw)) return [];
  const {plain} = stripTonesAndGetTones(pinyinRaw);
  const cleaned = plain.replace(/[^a-zü]/g, '');
  if (!cleaned) return [];
  const syls = splitPySyllables(cleaned);
  const warnings = [];
  const seen = new Set();
  const add = msg => { if (!seen.has(msg)){ warnings.push(msg); seen.add(msg); } };

  syls.forEach(syl => {
    if (AUDIO_WARN_BUZZED_I[syl]){
      add(AUDIO_WARN_BUZZED_I[syl]);
      return; // buzzed-i case already covers this syllable's retroflex/sibilant issue
    }
    if (/^(ju|qu|xu|yu)/.test(syl) || syl.includes('ü')){
      add('Audio often flattens ü toward "oo" or "yu" — keep your lips rounded and tight while saying "ee", tighter than the audio suggests.');
    }
    if (['zh','ch','sh'].some(i => syl.startsWith(i)) || /^r[^i]/.test(syl)){
      add('Retroflex sounds (tongue curled back) are often under-curled by device audio — treat the audio here as a rough guide, not a model to copy exactly.');
    }
  });
  return warnings;
}
function renderPronunciationBox(pinyinText){
  const {tips, toneSummary} = computeTips(pinyinText);
  const soundsLike = pinyinToEnglishApprox(pinyinText);
  const audioWarnings = getAudioWarning(pinyinText);
  if (!tips.length && !toneSummary && !soundsLike && !audioWarnings.length) return null;
  const box = document.createElement('div');
  box.className = 'pron-box';
  let html = '';
  if (soundsLike) html += `<div class="pron-sounds-like">🔤 Sounds like: <b>${soundsLike}</b></div>`;
  if (toneSummary) html += `<div class="pron-tones">🎵 ${toneSummary}</div>`;
  if (audioWarnings.length) html += audioWarnings.map(w => `<div class="pron-tip-warn">⚠ <b>Audio note:</b> ${w}</div>`).join('');
  if (tips.length) html += tips.map(t => `<div class="pron-tip">${t}</div>`).join('');
  box.innerHTML = html;
  return box;
}

let chipTipCounter = 0;
const toneShapeShort = {1:'flat & high',2:'rising',3:'dip, rise',4:'sharp fall'};
// Compact per-word tone badge + English-sounds-like text + tappable ⓘ for any real sound trap.
function appendChipPronunciation(chip, pinyinText){
  const {tips} = computeTips(pinyinText);
  const {tones} = stripTonesAndGetTones(pinyinText);
  const soundsLike = pinyinToEnglishApprox(pinyinText);

  if (tones.length){
    const badge = document.createElement('span');
    badge.className = 'tone-badge';
    badge.textContent = tones.map(t => t + (toneShapeShort[t] ? ' · ' + toneShapeShort[t] : '')).join(' / ');
    chip.appendChild(badge);
  }

  if (soundsLike){
    const sl = document.createElement('span');
    sl.className = 'sounds-like';
    sl.textContent = '≈ ' + soundsLike;
    chip.appendChild(sl);
  }

  const audioWarnings = getAudioWarning(pinyinText);
  if (audioWarnings.length){
    const audioBtn = chip.querySelector('.chip-audio-btn');
    if (audioBtn){
      audioBtn.classList.add('has-warn');
      audioBtn.innerHTML = '🔊<span class="warn-dot">⚠</span>';
      audioBtn.title = 'Hear just this word — ⚠ audio may be misleading here, tap the warning for details';
    }
  }

  if (tips.length || audioWarnings.length){
    chipTipCounter++;
    const tipId = 'chiptip_' + chipTipCounter;
    const infoBtn = document.createElement('button');
    infoBtn.className = 'chip-info-btn' + (audioWarnings.length ? ' has-warn' : '');
    infoBtn.textContent = audioWarnings.length ? '⚠' : 'ⓘ';
    infoBtn.title = audioWarnings.length ? 'Why the audio is unreliable here' : 'How to say this sound';
    infoBtn.onclick = () => { document.getElementById(tipId).classList.toggle('show'); };
    chip.appendChild(infoBtn);
    const tipBox = document.createElement('div');
    tipBox.className = 'chip-tip';
    tipBox.id = tipId;
    let html = audioWarnings.map(w => `<div class="chip-tip-warn">⚠ <b>Audio note:</b> ${w}</div>`).join('');
    html += tips.map(t => `<div>${t}</div>`).join('');
    tipBox.innerHTML = html;
    chip.appendChild(tipBox);
  }
}

// ============ GRAMMAR (from chinese_learning_tracker.xlsx — same IDs as the phrasebook) ============
const GRAMMAR = {
  1: {tier:1, title:'Basic Sentence Order (SVO)', structure:'Subject + Verb + Object', example:'他吃饭', examplePinyin:'Tā chī fàn', exampleEn:'He eats food.', tip:'No articles (a/an/the) in Chinese.'},
  2: {tier:1, title:'Negation with 不/没', structure:'Subject + 不/没 + Verb', example:'他不是学生', examplePinyin:'Tā bú shì xuéshēng', exampleEn:'He is not a student.', tip:'不 for general negation; 没 only negates 有 (to have).'},
  3: {tier:1, title:'Simple Adjectives (很)', structure:'Subject + 很 + Adjective', example:'她很好看', examplePinyin:'Tā hěn hǎokàn', exampleEn:'She is good-looking.', tip:'是 is NOT used to link subject+adjective. 很 here is often neutral, not \'very\'.'},
  4: {tier:2, title:'Adjectives with 的', structure:'Adjective + 的 + Noun', example:'聪明的学生', examplePinyin:'Cōngmíng de xuéshēng', exampleEn:'Smart student(s)', tip:'的 dropped for common fixed phrases (小杯子).'},
  5: {tier:3, title:'Plurals', structure:'(no change to noun; context implies plural)', example:'他是学生 / 他们是学生', examplePinyin:'Tā shì xuéshēng / Tāmen shì xuéshēng', exampleEn:'He is a student. / They are students.', tip:'们 only for pronouns/people words, never with a number.'},
  6: {tier:3, title:'Colors', structure:'Color + 色 (as noun); Color + 的 + Noun (as adjective)', example:'蓝色的汽车', examplePinyin:'Lánsè de qìchē', exampleEn:'Blue car', tip:'色/的 often dropped in fixed terms e.g. 红苹果.'},
  7: {tier:2, title:'Possessions with 的', structure:'Owner + 的 + Noun', example:'你的车', examplePinyin:'Nǐ de chē', exampleEn:'Your car', tip:'的 dropped for family/close institutions: 我妈妈, not 我的妈妈.'},
  8: {tier:1, title:'Auxiliary Verbs (想/要/会)', structure:'Subject + Aux Verb + Verb + Object', example:'我想说中文', examplePinyin:'Wǒ xiǎng shuō Zhōngwén', exampleEn:'I want to speak Chinese.', tip:'想=want/wish, 要=want/will/should, 会=capable of/will.'},
  9: {tier:2, title:'Expressing \'and\' with 和', structure:'Noun + 和 + Noun', example:'兔子喜欢萝卜和生菜', examplePinyin:'Tùzi xǐhuan luóbo hé shēngcài', exampleEn:'Rabbits like carrots and lettuce.', tip:'和 links nouns only, not clauses or verbs.'},
  10: {tier:1, title:'Basic Numbers (0-99)', structure:'Tens digit + 十 + ones digit', example:'三十八', examplePinyin:'Sānshíbā', exampleEn:'38', tip:'11-19 = 十 + digit; 20/30... = digit + 十.'},
  11: {tier:1, title:'Quantity & Measure Words', structure:'Number + Measure Word + Noun', example:'一个问题', examplePinyin:'Yí gè wèntí', exampleEn:'One question', tip:'个 is the universal fallback measure word.'},
  12: {tier:1, title:'\'This\' and \'That\' (这个/那个)', structure:'这/那 + 个 + (Noun)', example:'我要这个', examplePinyin:'Wǒ yào zhège', exampleEn:'I want this one.', tip:'Essential for pointing at menus/products.'},
  13: {tier:3, title:'Large Numbers (100-100M)', structure:'Number + 百/千/万/亿', example:'两千五百', examplePinyin:'Liǎngqiān wǔbǎi', exampleEn:'2,500', tip:'Chinese base unit is 10,000 (万), not 1,000.'},
  14: {tier:2, title:'Days of the Week', structure:'星期 + number (1-6); Sunday = 星期天/日', example:'星期三', examplePinyin:'Xīngqīsān', exampleEn:'Wednesday', tip:'礼拜 and 周 are alternate words for \'week\'.'},
  15: {tier:2, title:'Time', structure:'Hour + 点 + Minute + 分', example:'七点半', examplePinyin:'Qī diǎn bàn', exampleEn:'7:30', tip:'半 = half; 分 often dropped in speech.'},
  16: {tier:3, title:'Duration of Time', structure:'Number + (个) + Time Unit', example:'两个小时', examplePinyin:'Liǎng gè xiǎoshí', exampleEn:'Two hours', tip:'个 usage varies by unit — must memorize per unit.'},
  17: {tier:1, title:'Basic Questions with 吗', structure:'Statement + 吗？', example:'你要去超市吗？', examplePinyin:'Nǐ yào qù chāoshì ma?', exampleEn:'Do you want to go to the supermarket?', tip:'Turns any statement into yes/no question; nothing else moves.'},
  18: {tier:1, title:'Yes/No Questions with 不 (A-not-A)', structure:'Verb/Adj + 不 + Verb/Adj', example:'你去不去？', examplePinyin:'Nǐ qù bu qù?', exampleEn:'Are you going (or not)?', tip:'有 negates with 没: 有没有?'},
  19: {tier:2, title:'Time Words/Phrases', structure:'(Time) + Subject + (Time) + Verb + Object', example:'我明天去商场', examplePinyin:'Wǒ míngtiān qù shāngchǎng', exampleEn:'I will go to the store tomorrow.', tip:'No verb tense — time is shown by time words only.'},
  20: {tier:2, title:'Past Actions with 了', structure:'Verb + 了', example:'我去了商场', examplePinyin:'Wǒ qù le shāngchǎng', exampleEn:'I went to the store.', tip:'Marks completion, NOT past tense — can appear in future sentences too.'},
  21: {tier:2, title:'Past Experiences with 过', structure:'Verb + 过', example:'我去过', examplePinyin:'Wǒ qù guo', exampleEn:'I\'ve been there.', tip:'Marks lifetime experience, not just \'past\'.'},
  22: {tier:2, title:'Negative Past Actions with 没(有)', structure:'没(有) + Verb', example:'我没看过', examplePinyin:'Wǒ méi kàn guo', exampleEn:'I have not seen (it).', tip:'ALL verbs use 没(有) to negate the past, not just 有.'},
  23: {tier:1, title:'Future Actions with 要/会', structure:'Subject + 要/会 + Verb', example:'你一定会成功', examplePinyin:'Nǐ yídìng huì chénggōng', exampleEn:'You will definitely succeed.', tip:'要=intention/plan; 会=likelihood/certainty.'},
  24: {tier:1, title:'Location (在)', structure:'Subject + 在 + Place (as verb); or 在+Place before main verb', example:'我在家', examplePinyin:'Wǒ zài jiā', exampleEn:'I am at home.', tip:'在-phrase goes before the verb, unlike English.'},
  25: {tier:2, title:'Action in Progress with 在', structure:'在 + Verb (like \'-ing\')', example:'你在上班吗？', examplePinyin:'Nǐ zài shàngbān ma?', exampleEn:'Are you working?', tip:'正在 emphasizes \'right now\'.'},
  26: {tier:1, title:'Who? What? Where? Which?', structure:'Question word replaces the answer\'s position', example:'她是谁？', examplePinyin:'Tā shì shéi?', exampleEn:'Who is she?', tip:'谁/什么/哪里/哪儿/哪个 — word order doesn\'t change.'},
  27: {tier:1, title:'Why? How?', structure:'为什么 (why, after subject); 怎么 (how, before verb)', example:'你为什么想去日本？', examplePinyin:'Nǐ wèishénme xiǎng qù Rìběn?', exampleEn:'Why do you want to go to Japan?', tip:'因为 = \'because\', starts the answer.'},
  28: {tier:2, title:'\'All\' and \'Also\' (都/也)', structure:'Subject + 都/也 + Verb/Adj', example:'我们都喜欢吃西瓜', examplePinyin:'Wǒmen dōu xǐhuan chī xīguā', exampleEn:'We all like watermelon.', tip:'都 = all/both; 也 = also/too.'},
  29: {tier:1, title:'Ability, Possibility, Permission (能/可以)', structure:'Subject + 能/可以 + Verb', example:'我可以请个假吗？', examplePinyin:'Wǒ kěyǐ qǐng gè jià ma?', exampleEn:'Can I take a day off?', tip:'能=ability/possibility; 可以=possibility/permission.'},
  30: {tier:1, title:'Commands', structure:'Verb (+ Object), optionally + 请 before', example:'请进来', examplePinyin:'Qǐng jìnlái', exampleEn:'Please come in.', tip:'请 softens any command into a polite request.'},
  31: {tier:2, title:'Negative Commands', structure:'不要/别 + Verb', example:'别说谎', examplePinyin:'Bié shuōhuǎng', exampleEn:'Don\'t tell lies.', tip:'不要 and 别 are interchangeable.'},
  32: {tier:2, title:'Suggestions (吧)', structure:'Statement + 吧', example:'咱们一起逛街吧', examplePinyin:'Zánmen yìqǐ guàngjiē ba', exampleEn:'Let\'s go shopping together!', tip:'咱们=we (incl. listener); 我们=we (may exclude listener).'},
  33: {tier:2, title:'Asking About Choices (还是)', structure:'Option A + 还是 + Option B？', example:'你要冰水还是热水？', examplePinyin:'Nǐ yào bīngshuǐ háishi rèshuǐ?', exampleEn:'Do you want ice water or hot water?', tip:'还是 is question-only; use 或者 for statements.'},
  34: {tier:3, title:'Verb + Complement (得)', structure:'Verb + 得 + (很) + Adjective', example:'你做得很好', examplePinyin:'Nǐ zuò de hěn hǎo', exampleEn:'You did a great job.', tip:'得 links a verb to a result/degree complement.'},
  35: {tier:3, title:'Adverbs with 地', structure:'Adjective + 地 + Verb', example:'乌龟慢慢地爬', examplePinyin:'Wūguī mànmàn de pá', exampleEn:'Turtles crawl slowly.', tip:'地 = the Chinese \'-ly\'; single-character adjectives often double.'},
  36: {tier:3, title:'\'More\' and \'Most\' (更/最)', structure:'更/最 + Adjective', example:'我最喜欢猫', examplePinyin:'Wǒ zuì xǐhuan māo', exampleEn:'Cats are my favorite.', tip:'Can precede certain mental-state verbs too (爱/恨/希望).'},
  37: {tier:3, title:'Extremes with 太', structure:'太 + Adjective + 了', example:'这个太可爱了！', examplePinyin:'Zhège tài kě\'ài le!', exampleEn:'This is so cute!', tip:'太 = \'too\' or \'so\', always paired with 了 in this pattern.'},
  38: {tier:2, title:'Questions with 呢', structure:'Noun/Pronoun + 呢', example:'你呢？', examplePinyin:'Nǐ ne?', exampleEn:'What about you?', tip:'Also asks \'where is X?\' when something is obviously missing.'},
  39: {tier:3, title:'Tag Questions', structure:'Statement + 对吗/是吗/好吗', example:'你说你是医生，对吗？', examplePinyin:'Nǐ shuō nǐ shì yīshēng, duì ma?', exampleEn:'You said you\'re a doctor, right?', tip:'对不对/是不是/好不好 are more direct/blunt versions.'},
  40: {tier:2, title:'Age', structure:'Number + 岁 (+了)', example:'我27岁了', examplePinyin:'Wǒ èrshíqī suì le', exampleEn:'I am 27 years old.', tip:'了 implies \'have turned\' — a change of state.'},
  41: {tier:3, title:'Date', structure:'Year (digit by digit) + 年 + Month + 月 + Day + 号/日', example:'二零二四年十月十八号', examplePinyin:'Èr líng èr sì nián shí yuè shíbā hào', exampleEn:'October 18th, 2024', tip:'Year read digit-by-digit, not as a whole number; year comes first.'},
};

// ============ STATE ============
let currentLesson = null;
let showPronunciation = false; // global toggle for pronunciation guide boxes
let completedLessons = {};
let progressSaveTimer = null;
let progressSaveChain = Promise.resolve();
let zhVoice = null;
let gramTipCounter = 0;
let exRevealCounter = 0;
let speechRate = 0.85; // adjustable playback speed, persisted below

// ============ TTS ============
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  zhVoice = voices.find(v => v.lang === 'zh-CN') || voices.find(v => v.lang && v.lang.startsWith('zh')) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, btn){
  if (!('speechSynthesis' in window)){ alert('Audio not supported on this device/browser.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  if (zhVoice) u.voice = zhVoice;
  u.rate = speechRate;
  if (btn) btn.classList.add('playing');
  u.onend = () => { if (btn) btn.classList.remove('playing'); };
  u.onerror = () => { if (btn) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}

// ============ PROGRESS PERSISTENCE (debounced) ============
function persistProgress(){
  if (!window.storage) return;
  if (progressSaveTimer) clearTimeout(progressSaveTimer);
  progressSaveTimer = setTimeout(() => {
    progressSaveTimer = null;
    const snapshot = JSON.stringify(completedLessons);
    progressSaveChain = progressSaveChain.catch(() => {})
      .then(() => window.storage.set('lesson_progress_v1', snapshot, false))
      .catch(err => console.error('Could not persist lesson progress:', err));
  }, 600);
}
async function loadProgress(){
  if (!window.storage) return;
  try{
    const res = await window.storage.get('lesson_progress_v1', false);
    if (res && res.value) completedLessons = JSON.parse(res.value);
  } catch(err){ completedLessons = {}; }
  render();
}
function toggleComplete(lessonId){
  completedLessons[lessonId] = !completedLessons[lessonId];
  persistProgress();
  render();
}

// ============ RENDER: TOKEN LINE (inline colored hanzi) ============
function renderTokSpan(toks, cls){
  const span = document.createElement('span');
  span.className = cls || '';
  toks.forEach(t => {
    const s = document.createElement('span');
    s.className = 'tok';
    s.style.color = ROLES[t.role].color;
    s.textContent = t.hanzi;
    span.appendChild(s);
  });
  return span;
}

// ============ RENDER: PHRASE CARD (dialogue line — matches phrasebook exactly, plus speaker tag) ============
function renderPhraseCard(line, opts){
  opts = opts || {};
  const card = document.createElement('div');
  card.className = 'phrase-card';

  if (line.speakerLabel){
    const sp = document.createElement('span');
    sp.className = 'phrase-speaker' + (line.speaker === 'B' ? ' b' : '');
    sp.textContent = line.speakerLabel;
    card.appendChild(sp);
    card.appendChild(document.createElement('br'));
  }

  const enP = document.createElement('p');
  enP.className = 'phrase-en';
  enP.textContent = line.en;
  card.appendChild(enP);

  const row = document.createElement('div');
  row.className = 'phrase-row';
  row.appendChild(renderTokSpan(line.toks, 'phrase-cn'));

  const btn = document.createElement('button');
  btn.className = 'seal-btn';
  btn.textContent = '听';
  if (showPronunciation && getAudioWarning(toksToPinyin(line.toks)).length){
    btn.classList.add('has-warn');
    btn.innerHTML = '听<span class="warn-dot-round">⚠</span>';
    btn.title = '⚠ part of this line is unreliable in the audio — check the word chips below';
  }
  btn.onclick = () => speak(toksToHanzi(line.toks), btn);
  row.appendChild(btn);
  card.appendChild(row);

  const pinyinP = document.createElement('p');
  pinyinP.className = 'phrase-pinyin';
  pinyinP.textContent = toksToPinyin(line.toks);
  card.appendChild(pinyinP);

  const breakdown = document.createElement('div');
  breakdown.className = 'breakdown';
  line.toks.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'tok-chip';
    chip.innerHTML = `
      <span class="h" style="color:${ROLES[t.role].color}">${t.hanzi}</span>
      <span class="p">${t.pinyin}</span>
      <span class="g">${t.gloss}</span>
      <span class="dot" style="background:${ROLES[t.role].color}"></span>
      <span class="r" style="color:${ROLES[t.role].color}">${ROLES[t.role].short}</span>
    `;
    if (!/^[，。？！]$/.test(t.hanzi)){
      const wordAudioBtn = document.createElement('button');
      wordAudioBtn.className = 'chip-audio-btn';
      wordAudioBtn.textContent = '🔊';
      wordAudioBtn.title = 'Hear just this word';
      wordAudioBtn.onclick = () => speak(t.hanzi, wordAudioBtn);
      chip.appendChild(wordAudioBtn);
    }
    if (showPronunciation) appendChipPronunciation(chip, t.pinyin);
    breakdown.appendChild(chip);
  });
  card.appendChild(breakdown);

  if (line.structure){
    const sBox = document.createElement('div');
    sBox.className = 'structure-box';
    sBox.innerHTML = `<div class="sb-label">🧩 Sentence Structure</div><div class="sb-text">${line.structure}</div>`;
    card.appendChild(sBox);
  }

  if (line.grammar && line.grammar.length){
    const tagsRow = document.createElement('div');
    tagsRow.className = 'tags-row';
    const tipEls = [];
    line.grammar.forEach(gnum => {
      const g = GRAMMAR[gnum];
      if (!g) return;
      gramTipCounter++;
      const tipId = 'gtip_' + gramTipCounter;
      const pill = document.createElement('button');
      pill.className = 'gram-pill t' + g.tier;
      pill.textContent = '#' + gnum + ' ' + g.title;
      pill.onclick = () => { document.getElementById(tipId).classList.toggle('show'); };
      tagsRow.appendChild(pill);
      const tip = document.createElement('div');
      tip.className = 'gram-tip';
      tip.id = tipId;
      tip.innerHTML = `<b>#${gnum} ${g.title}</b> — ${g.tip}`;
      tipEls.push(tip);
    });
    card.appendChild(tagsRow);
    tipEls.forEach(t => card.appendChild(t));
  }

  return card;
}

// ============ RENDER: GRAMMAR POINT (deep-dive, Integrated-Chinese style) ============
function renderGrammarPoint(gp, index){
  const g = GRAMMAR[gp.gid];
  if (!g) return document.createElement('div');
  const card = document.createElement('div');
  card.className = 'gp-card';

  const head = document.createElement('div');
  head.className = 'gp-head';
  head.innerHTML = `<div class="gp-num">Grammar ${index}</div><div class="gp-title">#${gp.gid} ${g.title}</div>`;
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'gp-body';

  const structure = document.createElement('p');
  structure.className = 'gp-structure';
  structure.innerHTML = `<b>Structure:</b> ${g.structure}`;
  body.appendChild(structure);

  if (gp.note){
    const paras = Array.isArray(gp.note) ? gp.note : [gp.note];
    paras.forEach(text => {
      const n = document.createElement('p');
      n.className = 'gp-note';
      n.innerHTML = text;
      body.appendChild(n);
    });
  }

  (gp.examples || []).forEach((ex, i) => {
    const row = document.createElement('div');
    row.className = 'gp-example';
    const letter = document.createElement('div');
    letter.className = 'gp-letter';
    letter.textContent = String.fromCharCode(65 + i);
    row.appendChild(letter);
    const exBody = document.createElement('div');
    exBody.className = 'gp-ex-body';
    const cnLine = document.createElement('div');
    cnLine.style.display = 'flex';
    cnLine.style.alignItems = 'center';
    cnLine.style.gap = '8px';
    cnLine.appendChild(renderTokSpan(ex.toks, 'gp-ex-cn'));
    const exAudio = document.createElement('button');
    exAudio.className = 'seal-btn';
    exAudio.style.cssText = 'width:32px;height:32px;font-size:11px;flex-shrink:0;';
    exAudio.textContent = '听';
    if (showPronunciation && getAudioWarning(toksToPinyin(ex.toks)).length){
      exAudio.classList.add('has-warn');
      exAudio.innerHTML = '听<span class="warn-dot-round">⚠</span>';
      exAudio.title = '⚠ part of this example is unreliable in the audio — see the note below';
    }
    exAudio.onclick = () => speak(toksToHanzi(ex.toks), exAudio);
    cnLine.appendChild(exAudio);
    exBody.appendChild(cnLine);
    const py = document.createElement('div');
    py.className = 'gp-ex-pinyin';
    py.textContent = toksToPinyin(ex.toks);
    exBody.appendChild(py);
    if (showPronunciation){
      const pronBox = renderPronunciationBox(toksToPinyin(ex.toks));
      if (pronBox){ pronBox.style.marginTop = '6px'; exBody.appendChild(pronBox); }
    }
    const en = document.createElement('div');
    en.className = 'gp-ex-en';
    en.textContent = ex.en;
    exBody.appendChild(en);
    row.appendChild(exBody);
    body.appendChild(row);
  });

  if (gp.mistake){
    const m = document.createElement('div');
    m.className = 'gp-mistake';
    m.innerHTML = `<span class="x">✗</span> ${gp.mistake}`;
    body.appendChild(m);
  }

  (gp.exercises || []).forEach(ex => {
    exRevealCounter++;
    const exId = 'exans_' + exRevealCounter;
    const box = document.createElement('div');
    box.className = 'gp-exercise';
    box.innerHTML = `
      <div class="ex-label">Try it</div>
      <div class="ex-q">${ex.q}</div>
      <button class="ex-reveal">Show answer</button>
      <div class="ex-a" id="${exId}">${ex.a}</div>
    `;
    box.querySelector('.ex-reveal').onclick = (e) => {
      const a = document.getElementById(exId);
      a.classList.toggle('show');
      e.target.textContent = a.classList.contains('show') ? 'Hide answer' : 'Show answer';
    };
    body.appendChild(box);
  });

  card.appendChild(body);
  return card;
}

// ============ RENDER: LANGUAGE NOTES ============
function renderLanguageNotes(notes){
  const wrap = document.createElement('div');
  notes.forEach((n, i) => {
    const row = document.createElement('div');
    row.className = 'lang-note';
    const letter = document.createElement('div');
    letter.className = 'ln-letter';
    letter.textContent = String.fromCharCode(97 + i);
    row.appendChild(letter);
    const b = document.createElement('div');
    b.className = 'ln-body';
    b.innerHTML = `<p class="ln-term">${n.term}</p>${n.pinyin ? `<p class="ln-pinyin">${n.pinyin}</p>` : ''}<p class="ln-text">${n.text}</p>`;
    row.appendChild(b);
    wrap.appendChild(row);
  });
  return wrap;
}

// ============ RENDER: VERB SPOTLIGHT ============
function renderVerbSpotlight(vs){
  const card = document.createElement('div');
  card.className = 'verb-spot';
  const patternsHtml = vs.patterns.map(p =>
    `<div class="vs-pattern"><span class="vp-cn">${p.cn}</span> <span class="vp-pinyin">(${p.pinyin})</span> — ${p.en}</div>`
  ).join('');
  const vsWarnings = getAudioWarning(vs.pinyin);
  card.innerHTML = `
    <div class="vs-label">✨ Common Verb Spotlight</div>
    <div class="vs-hanzi">${vs.hanzi}</div>
    <div class="vs-pinyin">${vs.pinyin}</div>
    <div class="vs-gloss">${vs.gloss}</div>
    <div class="vs-patterns">${patternsHtml}</div>
    <button class="vs-audio${vsWarnings.length ? ' has-warn' : ''}">🔊 Hear it${vsWarnings.length ? '<span class="warn-dot">⚠</span>' : ''}</button>
    ${vsWarnings.length ? `<div class="vs-audio-warn">⚠ <b>Audio note:</b> ${vsWarnings.join(' ')}</div>` : ''}
  `;
  card.querySelector('.vs-audio').onclick = () => speak(vs.hanzi);
  return card;
}

// ============ RENDER: VOCAB TABLE ============
function renderVocabTable(vocab){
  const table = document.createElement('table');
  table.className = 'vocab-table';
  table.innerHTML = `<thead><tr><th>Word</th><th>Pinyin</th><th>Part of Speech</th><th>Definition</th><th></th></tr></thead>`;
  const tbody = document.createElement('tbody');
  vocab.forEach(v => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="vt-hanzi">${v.hanzi}</td>
      <td class="vt-pinyin"></td>
      <td class="vt-pos">${v.pos || ''}</td>
      <td class="vt-def">${v.gloss}</td>
      <td></td>
    `;
    const pinyinTd = tr.querySelector('.vt-pinyin');
    pinyinTd.appendChild(document.createTextNode(v.pinyin));
    const vocabAudioWarnings = getAudioWarning(v.pinyin);
    if (showPronunciation){
      const {tips} = computeTips(v.pinyin);
      const {tones} = stripTonesAndGetTones(v.pinyin);
      if (tones.length){
        const badge = document.createElement('div');
        badge.className = 'tone-badge';
        badge.style.marginTop = '3px';
        badge.textContent = tones.map(t => t + (toneShapeShort[t] ? ' · ' + toneShapeShort[t] : '')).join(' / ');
        pinyinTd.appendChild(badge);
      }
      if (tips.length || vocabAudioWarnings.length){
        chipTipCounter++;
        const tipId = 'vocabtip_' + chipTipCounter;
        const infoBtn = document.createElement('button');
        infoBtn.className = 'chip-info-btn' + (vocabAudioWarnings.length ? ' has-warn' : '');
        infoBtn.style.marginTop = '3px';
        infoBtn.textContent = vocabAudioWarnings.length ? '⚠' : 'ⓘ';
        infoBtn.title = vocabAudioWarnings.length ? 'Why the audio is unreliable here' : 'How to say this sound';
        infoBtn.onclick = () => { document.getElementById(tipId).classList.toggle('show'); };
        pinyinTd.appendChild(infoBtn);
        const tipBox = document.createElement('div');
        tipBox.className = 'chip-tip';
        tipBox.id = tipId;
        tipBox.style.maxWidth = '180px';
        let tipHtml = vocabAudioWarnings.map(w => `<div class="chip-tip-warn">⚠ <b>Audio note:</b> ${w}</div>`).join('');
        tipHtml += tips.map(t => `<div>${t}</div>`).join('');
        tipBox.innerHTML = tipHtml;
        pinyinTd.appendChild(tipBox);
      }
    }
    const audioBtn = document.createElement('button');
    audioBtn.className = 'vt-audio' + (showPronunciation && vocabAudioWarnings.length ? ' has-warn' : '');
    audioBtn.innerHTML = (showPronunciation && vocabAudioWarnings.length) ? '🔊<span class="warn-dot-round">⚠</span>' : '🔊';
    if (showPronunciation && vocabAudioWarnings.length) audioBtn.title = '⚠ audio may be misleading here, see ⓘ';
    audioBtn.onclick = () => speak(v.hanzi);
    tr.lastElementChild.appendChild(audioBtn);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

// ============ LESSONS ============

// ============ RENDER: LESSON LIST ============
function renderLessonList(){
  const main = document.getElementById('main');
  main.innerHTML = '';

  const doneCount = LESSONS.filter(l => completedLessons[l.id]).length;
  const pct = Math.round((doneCount / LESSONS.length) * 100);

  const prog = document.createElement('div');
  prog.className = 'progress-card';
  prog.innerHTML = `
    <div class="progress-top"><span class="num">${doneCount} / ${LESSONS.length}</span><span class="lbl">lessons complete</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
  main.appendChild(prog);

  const grid = document.createElement('div');
  grid.className = 'lesson-grid';

  LESSONS.forEach(lesson => {
    const done = !!completedLessons[lesson.id];
    const card = document.createElement('div');
    card.className = 'lesson-card' + (done ? ' done' : '');
    const tagsHtml = (lesson.grammarPoints || []).map(gp => {
      const g = GRAMMAR[gp.gid];
      return g ? `<span class="lesson-tag">#${gp.gid} ${g.title}</span>` : '';
    }).join('');
    card.innerHTML = `
      <div class="lesson-num">${lesson.type === 'phonetics' ? lesson.icon : lesson.num}</div>
      <div class="lesson-body">
        <p class="lesson-title">${lesson.title}</p>
        <p class="lesson-cn">${lesson.cn}</p>
        <div class="lesson-tags">${tagsHtml}</div>
      </div>
      ${done ? '<span class="lesson-check">✓</span>' : ''}
      <svg class="lesson-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    `;
    card.onclick = () => { currentLesson = lesson; render(); window.scrollTo(0,0); };
    grid.appendChild(card);
  });

  main.appendChild(grid);
}

function renderPhoneticsLesson(lesson){
  const main = document.getElementById('main');
  main.innerHTML = '';

  const backRow = document.createElement('div');
  backRow.className = 'back-row';
  backRow.innerHTML = `<button class="back-btn" id="backToList"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>`;

  const header = document.createElement('div');
  header.className = 'lesson-header';
  header.innerHTML = `<span class="eyebrow">Lesson 0</span><h2>${lesson.title}</h2><p class="cn-title">${lesson.cn}</p>`;
  main.appendChild(header);

  const introBlock = document.createElement('div');
  introBlock.className = 'block';
  introBlock.innerHTML = `<p style="font-size:13.5px;line-height:1.6;margin:0;">${lesson.intro}</p>`;
  main.appendChild(introBlock);

  const toneBlock = document.createElement('div');
  toneBlock.className = 'block';
  toneBlock.innerHTML = `<div class="block-title">The Four Tones (+ neutral)</div>`;
  const grid = document.createElement('div');
  grid.className = 'tone-grid';
  lesson.tones.forEach(t => {
    const cell = document.createElement('div');
    cell.className = 'tone-cell';
    const tWarnings = getAudioWarning(t.pinyin);
    cell.innerHTML = `<div class="t-hanzi">${t.hanzi}${tWarnings.length ? '<span class="warn-dot">⚠</span>' : ''}</div><div class="t-pinyin">${t.pinyin}</div><div class="t-gloss">${t.gloss}</div><div class="t-num">${t.num}</div>`;
    if (tWarnings.length) cell.title = '⚠ Audio note: ' + tWarnings.join(' ');
    cell.onclick = () => speak(t.hanzi);
    grid.appendChild(cell);
  });
  toneBlock.appendChild(grid);
  const playAllBtn = document.createElement('button');
  playAllBtn.className = 'complete-btn';
  playAllBtn.style.marginTop = '10px';
  playAllBtn.textContent = '🔊 Play all five in sequence';
  playAllBtn.onclick = () => {
    let i = 0;
    const playNext = () => {
      if (i >= lesson.tones.length) return;
      const u = new SpeechSynthesisUtterance(lesson.tones[i].hanzi);
      u.lang = 'zh-CN';
      if (zhVoice) u.voice = zhVoice;
      u.rate = speechRate;
      u.onend = () => { i++; setTimeout(playNext, 250); };
      speechSynthesis.speak(u);
    };
    speechSynthesis.cancel();
    playNext();
  };
  toneBlock.appendChild(playAllBtn);
  main.appendChild(toneBlock);

  const trapBlock = document.createElement('div');
  trapBlock.className = 'block';
  trapBlock.innerHTML = `<div class="block-title">Pinyin Traps for English Speakers</div>`;
  lesson.traps.forEach(t => {

    row.className = 'trap-row';
    row.innerHTML = `<div class="tr-pair">${t.pair}</div><div class="tr-note">${t.note}</div>`;
    trapBlock.appendChild(row);
  });
  main.appendChild(trapBlock);

  const sandhiBlock = document.createElement('div');
  sandhiBlock.className = 'block';
  sandhiBlock.innerHTML = `<div class="block-title">Tone Change Rules (Sandhi)</div>`;
  lesson.sandhi.forEach(s => {
    const row = document.createElement('div');
    row.className = 'trap-row';
    row.innerHTML = `<div class="tr-pair">${s.rule}</div><div class="tr-note"><b>${s.example}</b><br>${s.note}</div>`;
    sandhiBlock.appendChild(row);
  });
  main.appendChild(sandhiBlock);

  const ytBlock = document.createElement('div');
  ytBlock.className = 'block';
  ytBlock.innerHTML = `<div class="block-title">Your Turn</div><div class="yt-card"><p class="yt-prompt">${lesson.yourTurn}</p></div>`;
  main.appendChild(ytBlock);

  renderCompleteAndNav(main, lesson);
}

function createToggleBlock(titleText){
  const block = document.createElement('div');
  block.className = 'block';
  const titleEl = document.createElement('div');
  titleEl.className = 'block-title';
  titleEl.innerHTML = `<span>${titleText}</span><svg class="bt-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>`;
  const content = document.createElement('div');
  content.className = 'block-content';
  titleEl.onclick = () => {
    content.classList.toggle('collapsed');
    titleEl.classList.toggle('collapsed');
  };
  block.appendChild(titleEl);
  block.appendChild(content);
  return {block, content};
}

function renderCompleteAndNav(main, lesson){
  const done = !!completedLessons[lesson.id];
  const completeRow = document.createElement('div');
  completeRow.className = 'complete-row';
  const btn = document.createElement('button');
  btn.className = 'complete-btn' + (done ? ' done' : '');
  btn.textContent = done ? '✓ Lesson complete' : 'Mark lesson complete';
  btn.onclick = () => toggleComplete(lesson.id);
  completeRow.appendChild(btn);
  main.appendChild(completeRow);

  const idx = LESSONS.findIndex(l => l.id === lesson.id);
  const navRow = document.createElement('div');
  navRow.className = 'lesson-nav';
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '‹ Prev';
  prevBtn.disabled = idx <= 0;
  prevBtn.onclick = () => { currentLesson = LESSONS[idx-1]; render(); window.scrollTo(0,0); };
  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'Next ›';
  nextBtn.disabled = idx >= LESSONS.length - 1;
  nextBtn.onclick = () => { currentLesson = LESSONS[idx+1]; render(); window.scrollTo(0,0); };
  navRow.appendChild(prevBtn);
  navRow.appendChild(nextBtn);
  main.appendChild(navRow);
}

function stripDiacritics(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function buildSearchIndex(){
  const index = [];
  LESSONS.forEach(l => {
    const lessonLabel = l.type === 'phonetics' ? 'Lesson 0 · ' + l.title : `Lesson ${l.num} · ${l.title}`;
    (l.vocab || []).forEach(v => {
      index.push({kind:'Vocab', lesson:l, lessonLabel, hanzi:v.hanzi, pinyin:v.pinyin, en:v.gloss});
    });
    (l.languageNotes || []).forEach(n => {
      index.push({kind:'Note', lesson:l, lessonLabel, hanzi:n.term, pinyin:n.pinyin || '', en:n.text});
    });
    if (l.verbSpotlight){
      (l.verbSpotlight.patterns || []).forEach(p => {
        index.push({kind:'Pattern', lesson:l, lessonLabel, hanzi:p.cn, pinyin:p.pinyin, en:p.en});
      });
    }
    const collectLines = (block) => {
      (block?.lines || []).forEach(line => {
        const hanzi = toksToHanzi(line.toks);
        const pinyin = toksToPinyin(line.toks);
        index.push({kind:'Dialogue', lesson:l, lessonLabel, hanzi, pinyin, en:line.en, toks:line.toks});
      });
    };
    collectLines(l.monologue);
    collectLines(l.dialogue);
  });
  return index;
}

function renderSearchResults(query){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const q = query.trim().toLowerCase();
  const qPlain = stripDiacritics(q);
  const index = buildSearchIndex();
  const results = index.filter(r =>
    (r.hanzi && r.hanzi.includes(query.trim())) ||
    (r.pinyin && stripDiacritics(r.pinyin.toLowerCase()).includes(qPlain)) ||
    (r.en && r.en.toLowerCase().includes(q))
  );

  const label = document.createElement('div');
  label.className = 'section-label';
  label.style.cssText = 'font-size:12px;color:var(--muted);margin:14px 0 8px;';
  label.textContent = results.length + ' result' + (results.length === 1 ? '' : 's');
  main.appendChild(label);

  if (results.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No matches yet — try a different word, or browse the lesson list.';
    main.appendChild(empty);
    return;
  }

  results.forEach(r => {
    const card = document.createElement('div');
    card.className = 'search-result-card';
    const top = document.createElement('div');
    top.className = 'sr-top';
    top.innerHTML = `<span class="sr-kind">${r.kind}</span><span class="sr-lesson">${r.lessonLabel}</span>`;
    card.appendChild(top);
    const hanziEl = document.createElement('div');
    hanziEl.className = 'sr-hanzi';
    if (r.kind === 'Dialogue' && r.toks){
      hanziEl.appendChild(renderTokSpan(r.toks));
    } else {
      hanziEl.textContent = r.hanzi;
    }
    card.appendChild(hanziEl);
    if (r.pinyin){
      const py = document.createElement('div');
      py.className = 'sr-pinyin';
      py.textContent = r.pinyin;
      card.appendChild(py);
    }
    const en = document.createElement('div');
    en.className = 'sr-en';
    en.textContent = r.en;
    card.appendChild(en);
    card.onclick = () => {
      document.getElementById('searchInput').value = '';
      currentLesson = r.lesson;
      render();
      window.scrollTo(0,0);
    };
    main.appendChild(card);
  });
}

function render(){
  const searchQuery = document.getElementById('searchInput').value;
  if (currentLesson === null && searchQuery.trim().length > 0){
    renderSearchResults(searchQuery);
  } else if (currentLesson === null){
    renderLessonList();
  } else if (currentLesson.type === 'phonetics'){
    renderPhoneticsLesson(currentLesson);
  } else {
    renderStandardLesson(currentLesson);
  }
}

// ============ LEGEND MODAL (color key — same pattern as the phrasebook) ============
function openLegend(){
  const sheet = document.getElementById('sheetContent');
  sheet.innerHTML = '<h3>Color key · 颜色说明</h3>';
  Object.keys(ROLES).forEach(r => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="dot" style="background:${ROLES[r].color}"></span> ${ROLES[r].label}`;
    sheet.appendChild(item);
  });
  const note = document.createElement('p');
  note.style.cssText = 'font-size:12.5px;color:var(--muted);margin-top:12px;';
  note.textContent = 'Every Chinese word in a dialogue, example, or vocab list is colored by its grammatical role, matching your Suzhou Survival phrasebook.';
  sheet.appendChild(note);
  const warnNote = document.createElement('p');
  warnNote.style.cssText = 'font-size:12.5px;color:var(--tier2);margin-top:8px;font-weight:600;';
  warnNote.textContent = '⚠ on a 🔊/听 button means the device audio for that word is known to be unreliable (buzzed i, ü, or retroflex sounds) — open the ⓘ/⚠ panel for the specific correction.';
  sheet.appendChild(warnNote);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'sheet-close';
  closeBtn.textContent = 'Close';
  closeBtn.onclick = closeOverlay;
  sheet.appendChild(closeBtn);
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('legendBtn').onclick = openLegend;
document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') closeOverlay(); };
document.getElementById('searchInput').oninput = () => { currentLesson = null; render(); };

// ============ INIT ============
document.getElementById('pronToggleBtn').onclick = () => {
  showPronunciation = !showPronunciation;
  document.getElementById('pronToggleBtn').classList.toggle('active', showPronunciation);
  render();
};

// ============ LAYOUT MODE (desktop-wide by default, toggle to mobile) ============
const appEl = document.querySelector('.app');
function setLayoutMode(mobile){
  appEl.classList.toggle('mobile-mode', mobile);
  document.getElementById('layoutToggleInput').checked = mobile;
  document.getElementById('layoutLabel').textContent = mobile ? '📱 Mobile' : '🖥️ Desktop';
}
async function loadLayoutPref(){
  let mobile = window.innerWidth < 700; // sensible default on an actual phone
  if (window.storage){
    try{
      const res = await window.storage.get('layout_mode_v1', false);
      if (res && res.value) mobile = (res.value === 'mobile');
    } catch(err){ /* no saved preference yet — fall back to viewport heuristic */ }
  }
  setLayoutMode(mobile);
}
document.getElementById('layoutToggleInput').onchange = (e) => {
  const mobile = e.target.checked;
  setLayoutMode(mobile);
  if (window.storage){
    window.storage.set('layout_mode_v1', mobile ? 'mobile' : 'desktop', false).catch(()=>{});
  }
};
loadLayoutPref();

// ============ SPEECH SPEED CONTROL ============
function setSpeechRate(rate, persist){
  speechRate = rate;
  document.querySelectorAll('#speedControl .speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === rate);
  });
  if (persist && window.storage){
    window.storage.set('speech_rate_v1', String(rate), false).catch(()=>{});
  }
}
document.querySelectorAll('#speedControl .speed-btn').forEach(b => {
  b.onclick = () => setSpeechRate(parseFloat(b.dataset.rate), true);
});
async function loadSpeechRatePref(){
  if (!window.storage) return;
  try{
    const res = await window.storage.get('speech_rate_v1', false);
    if (res && res.value) setSpeechRate(parseFloat(res.value), false);
  } catch(err){ /* no saved preference yet — keep the 0.85 default */ }
}
loadSpeechRatePref();

render();
loadProgress();
</script>
